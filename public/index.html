<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15171c;
    --panel: #1e2129;
    --panel-2: #262a34;
    --text: #e8e9ec;
    --muted: #8b90a0;
    --light: #e9dcc3;
    --dark: #a9825e;
    --green: #3fbf6a;
    --red: #e5484d;
    --gold: #f2c94c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 16px;
  }
  .app {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    max-width: 1440px;
  }
  .board-col {
    --size: min(88vw, 560px);
    --cw: clamp(58px, calc((var(--size) - 36px) / 7), 80px);
    display: flex; flex-direction: column; gap: 10px; align-items: stretch;
  }
  .shop-panel { width: 250px; }
  @media (max-width: 1220px) {
    .shop-panel { order: 3; width: min(88vw, 340px); }
    .panel { order: 2; }
  }
  .board-wrap {
    display: grid;
    grid-template-columns: 20px auto;
    grid-template-rows: auto 20px;
  }
  .ranks, .files {
    display: grid;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }
  .ranks { grid-template-rows: repeat(8, 1fr); align-items: center; }
  .files { grid-column: 2; grid-template-columns: repeat(8, 1fr); text-align: center; padding-top: 4px; }
  .board {
    width: var(--size);
    height: var(--size);
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    user-select: none;
  }
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .sq.light { background: var(--light); }
  .sq.dark { background: var(--dark); }
  .sq.selected { background: #e6c45a; }
  .sq.check { background: radial-gradient(circle, #ff5c5c 0%, #d63a3a 45%, transparent 75%), var(--dark); }
  .sq.light.check { background: radial-gradient(circle, #ff5c5c 0%, #d63a3a 45%, transparent 75%), var(--light); }
  .piece {
    font-size: calc(var(--size) / 8 * 0.78);
    line-height: 1;
    position: relative;
    z-index: 2;
    transition: opacity .15s;
  }
  .piece.w { color: #fbfbfb; text-shadow: 0 0 2px #000, 0 0 1px #000, 0 2px 3px rgba(0,0,0,.35); }
  .piece.b { color: #1d1d22; text-shadow: 0 0 1px rgba(255,255,255,.35); }
  .piece.dead { opacity: .35; }
  .dot {
    position: absolute;
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: var(--green);
    opacity: .85;
    z-index: 1;
  }
  .ring {
    position: absolute;
    inset: 4%;
    border-radius: 50%;
    border: 5px solid var(--green);
    z-index: 3;
    pointer-events: none;
  }
  .panel {
    width: min(88vw, 340px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .turn {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
  }
  .swatch {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #555;
  }
  .swatch.w { background: #fbfbfb; }
  .swatch.b { background: #1d1d22; border-color: #888; }
  .roll {
    font-size: 26px;
    font-weight: 700;
    color: var(--gold);
    min-height: 34px;
    text-transform: capitalize;
  }
  .roll.rolling { color: var(--muted); }
  .msg { color: var(--muted); font-size: 14px; min-height: 20px; margin-top: 4px; line-height: 1.4; }
  .msg.warn { color: var(--red); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--panel-2);
    text-transform: capitalize;
  }
  .chip.lost { text-decoration: line-through; color: #5c6170; background: transparent; border: 1px dashed #3a3f4b; }
  .king-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
  .king-row:last-child { margin-bottom: 0; }
  .side { margin-bottom: 10px; }
  .side:last-child { margin-bottom: 0; }
  .captured {
    min-height: 30px;
    font-size: 26px;
    line-height: 1.1;
    letter-spacing: 1px;
  }
  .captured .piece { font-size: 26px; }
  .captured .none { font-size: 13px; color: #5c6170; }
  .log {
    max-height: 170px;
    overflow-y: auto;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-direction: column-reverse;
    gap: 4px;
  }
  .log div b { color: var(--text); font-weight: 600; }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #3a3f4b;
    border-radius: 8px;
    padding: 10px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #2f3440; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: none;
    align-items: center; justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay .box {
    background: var(--panel);
    padding: 28px 32px;
    border-radius: 14px;
    text-align: center;
    max-width: 320px;
  }
  .overlay h2 { margin: 0 0 6px; font-size: 26px; }
  .overlay p { color: var(--muted); margin: 0 0 18px; }
  .promo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
  .promo-grid button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; text-transform: capitalize; }
  .promo-grid .g { font-size: 34px; line-height: 1; color: #fbfbfb; text-shadow: 0 0 2px #000; }
  .rules { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .rules summary { cursor: pointer; color: var(--text); font-weight: 600; }
  .rules ul { padding-left: 18px; margin: 8px 0 0; }
  .online-row { display: flex; gap: 8px; margin-top: 10px; }
  .online-row input {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--text);
    border: 1px solid #3a3f4b; border-radius: 8px;
    padding: 8px 10px; font: inherit; font-size: 12px;
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 6px; color: var(--muted); }
  .status .led { width: 8px; height: 8px; border-radius: 50%; background: #5c6170; }
  .status .led.on { background: var(--green); }
  .status .led.wait { background: var(--gold); }
  .small { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 8px; }
  .row-btns { display: flex; gap: 8px; margin-top: 10px; }
  .row-btns button { flex: 1; }
  button.primary { background: var(--green); border-color: var(--green); color: #0d1a12; }
  button.primary:hover { background: #4fd27b; }
  .who { font-size: 15px; font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; text-transform: none; }

  /* ---------- playing cards ---------- */
  .hand-zone { margin-left: 20px; width: var(--size); }
  .hand-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px 2px; }
  .hand-label .swatch { width: 12px; height: 12px; border-width: 1px; }
  .hand-row { display: flex; gap: 6px; justify-content: center; min-height: calc(var(--cw) * 1.4 + 8px); padding: 4px 2px; overflow-x: auto; }
  .hand-row.opp { min-height: calc(var(--cw) * 1.1 + 8px); }
  .hand-empty { align-self: center; font-size: 12px; color: #5c6170; }
  .gcard {
    --c1: #555; --c2: #222; --ink: #fff;
    flex: 0 0 auto;
    width: var(--cw); height: calc(var(--cw) * 1.4);
    border-radius: 9px; position: relative; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.28), transparent 60%), linear-gradient(165deg, var(--c1), var(--c2));
    box-shadow: 0 6px 14px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.28);
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding: 7px 5px 6px;
    cursor: pointer; user-select: none;
    transition: transform .15s, box-shadow .15s, opacity .15s;
  }
  .gcard::before { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(255,255,255,.35); border-radius: 7px; pointer-events: none; }
  .gcard::after { /* shine */
    content: ""; position: absolute; top: -40%; left: -60%; width: 60%; height: 180%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent); transform: rotate(18deg); pointer-events: none;
  }
  .gcard:hover { transform: translateY(-5px); }
  .gcard.sel { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--gold), 0 10px 22px rgba(0,0,0,.55); }
  .gcard.off { opacity: .55; }
  .gcard .cname { font-size: calc(var(--cw) * .105); overflow-wrap: anywhere; max-width: 100%; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; text-align: center; line-height: 1.08; min-height: 2.2em; display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 2px rgba(0,0,0,.45); z-index: 1; }
  .gcard .art { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; z-index: 1; }
  .gcard .art .disc { width: 74%; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(0,0,0,.25) 70%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.35); }
  .gcard .art svg { width: 70%; height: 70%; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .gcard .foot { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: calc(var(--cw) * .11); font-weight: 700; z-index: 1; padding: 0 2px; }
  .gcard .lv { background: rgba(0,0,0,.35); border-radius: 999px; padding: 1px 6px; letter-spacing: .05em; }
  .gcard .tag { opacity: .9; }
  .k-barricade.gcard { --c1: #4d93ee; --c2: #142f5c; }
  .k-abra.gcard { --c1: #b072f2; --c2: #35145f; }
  .k-mine.gcard { --c1: #f2694f; --c2: #5e140e; }
  .k-reborn.gcard { --c1: #45d98a; --c2: #0c4a2c; }
  .k-nomad.gcard { --c1: #f6d36b; --c2: #7a4a0a; --ink: #2a1a02; }
  .k-nomad.gcard .cname { text-shadow: 0 1px 1px rgba(255,255,255,.4); }
  .gcard.back {
    width: calc(var(--cw) * .78); height: calc(var(--cw) * 1.1); cursor: default; padding: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(242,201,76,.25) 0 22%, transparent 23%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 6px, transparent 6px 12px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.06) 0 6px, transparent 6px 12px),
      linear-gradient(160deg, #3a3150, #17141f);
    box-shadow: 0 4px 10px rgba(0,0,0,.45), inset 0 0 0 2px rgba(242,201,76,.55);
    justify-content: center;
  }
  .gcard.back:hover { transform: none; }
  .gcard.back .emblem { font-size: calc(var(--cw) * .42); color: var(--gold); text-shadow: 0 2px 4px rgba(0,0,0,.6); z-index: 1; }
  .card-info { margin-left: 20px; width: var(--size); background: var(--panel); border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; min-height: 48px; }
  .card-info .txt { flex: 1; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .card-info .txt b { color: var(--text); display: block; font-size: 14px; }
  .card-info .btns { display: flex; gap: 6px; flex-shrink: 0; }
  .card-info button { padding: 8px 12px; font-size: 13px; }
  .shop-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .shop-item { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 9px; padding: 6px 8px; --cw: 40px; }
  .shop-item .gcard { cursor: default; padding: 3px 2px; }
  .shop-item .gcard:hover { transform: none; }
  .shop-item .gcard .cname, .shop-item .gcard .foot { display: none; }
  .shop-item .gcard .art .disc { width: 86%; }
  .shop-item .nm { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.25; }
  .shop-item button { padding: 6px 9px; font-size: 12px; white-space: nowrap; }
  .shop-points { font-size: 22px; font-weight: 700; color: var(--gold); }
  .discard-list .gcard { --cw: 76px; }
  .discard-list { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px; }
  /* ---------- animations ---------- */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  .fx { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); will-change: transform, opacity; }
  .fx-card { --cw: 74px; }
  .fx-card .gcard { box-shadow: 0 0 0 2px rgba(255,255,255,.5), 0 0 28px 6px var(--glow, rgba(255,255,255,.4)), 0 10px 24px rgba(0,0,0,.5); }
  .fx-card .gcard:hover { transform: none; }
  .fx-card.k-barricade { --glow: rgba(77,147,238,.85); }
  .fx-card.k-abra { --glow: rgba(176,114,242,.9); }
  .fx-card.k-mine { --glow: rgba(242,105,79,.9); }
  .fx-card.k-reborn { --glow: rgba(69,217,138,.9); }
  .fx-card.k-nomad { --glow: rgba(246,211,107,.95); }
  .fx-dot { width: 10px; height: 10px; border-radius: 50%; }
  .fx-star { font-size: 18px; line-height: 1; text-shadow: 0 0 6px currentColor; }
  .fx-ring { border-radius: 50%; border: 4px solid currentColor; }
  .fx-bar { width: 12%; border-radius: 3px; background: linear-gradient(90deg, #8fc2ff, #2f6fd0 60%, #1b3f7a); box-shadow: 0 0 8px rgba(77,147,238,.9); }
  .fx-lock { color: #e8f2ff; filter: drop-shadow(0 0 8px #4d93ee); }
  .fx-boom { border-radius: 50%; background: radial-gradient(circle, #fff6c2 0%, #ffb02e 30%, #ff4d1f 55%, rgba(120,20,0,0) 72%); }
  .fx-wash { position: absolute; transform: none; border-radius: 8px; }
  .fx-pillar { border-radius: 40% 40% 8px 8px; background: linear-gradient(to top, rgba(69,217,138,.95), rgba(69,217,138,.45) 60%, rgba(200,255,220,0)); filter: blur(1px); transform-origin: 50% 100%; }
  .fx-banner { font-size: 30px; font-weight: 800; color: var(--gold); background: rgba(20,22,28,.92); padding: 14px 26px; border-radius: 14px; box-shadow: 0 0 0 2px rgba(242,201,76,.6), 0 12px 30px rgba(0,0,0,.5); white-space: nowrap; }
  .fx-smoke { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle, rgba(255,140,120,.8), rgba(90,30,30,0) 70%); }
  .board.fx-shake { animation: fxShake .45s; }
  @keyframes fxShake { 0%,100% { transform: none; } 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, -2px); } 80% { transform: translate(3px, 3px); } }
  .board.fx-magic .piece { animation: fxWobble .9s ease-in-out; }
  @keyframes fxWobble { 0%,100% { transform: none; filter: none; } 30% { transform: rotate(-12deg) scale(1.12); filter: hue-rotate(120deg) brightness(1.3); } 60% { transform: rotate(10deg) scale(.92); filter: hue-rotate(250deg) brightness(1.2); } }
  @media (prefers-reduced-motion: reduce) { #fx { display: none; } }
  .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .lang-btn { padding: 6px 12px; font-size: 13px; }
  .sq.locked::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(45deg, rgba(40,120,220,.45) 0 6px, rgba(40,120,220,.12) 6px 12px);
    box-shadow: inset 0 0 0 3px #2878dc;
  }
  .lock-n { position: absolute; top: 2px; left: 4px; z-index: 4; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 0 2px #000; }
  .mine-mark { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; font-size: calc(var(--size) / 12); color: #ff4d4d; text-shadow: 0 0 3px #000; pointer-events: none; opacity: .9; }
  .dot.gold { background: var(--gold); width: 36%; height: 36%; }
  .sq.target { box-shadow: inset 0 0 0 3px rgba(242,201,76,.8); }
  .piece.gold { color: var(--gold) !important; }
  .piece.frozen { filter: drop-shadow(0 0 3px #7fc4ff); }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 13px; align-items: center; }
  .stats .muted { color: var(--muted); font-size: 12px; }
  .hand { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .card-item { background: var(--panel-2); border-radius: 8px; padding: 9px 10px; display: flex; gap: 10px; align-items: flex-start; }
  .card-item .body { flex: 1; min-width: 0; }
  .card-item .name { font-weight: 700; font-size: 14px; }
  .card-item .desc { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .card-item button { padding: 6px 10px; font-size: 12px; flex-shrink: 0; }
  .card-item.active { outline: 2px solid var(--gold); }
  .k-barricade .name { color: #6fb2ff; }
  .k-abra .name { color: #c58bff; }
  .k-mine .name { color: #ff7a6b; }
  .k-reborn .name { color: #6ee59a; }
  .k-nomad .name { color: var(--gold); }
  .shop-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
  .shop-row button { padding: 5px 10px; font-size: 12px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .effects { font-size: 13px; color: var(--text); display: flex; flex-direction: column; gap: 4px; }
  .discard-list { display: flex; flex-direction: column; gap: 6px; text-align: left; max-height: 60vh; overflow-y: auto; }
  .overlay .box.wide { max-width: 380px; }
  details.shop summary { cursor: pointer; font-weight: 600; font-size: 13px; margin-top: 12px; }
</style>
<script src="i18n.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div class="app">
  <div class="card shop-panel" id="shopPanel"></div>

  <div class="board-col">
    <div class="hand-zone">
      <div class="hand-label" id="oppLabel"></div>
      <div class="hand-row opp" id="oppHand"></div>
    </div>
    <div class="board-wrap">
      <div class="ranks" id="ranks"></div>
      <div class="board" id="board"></div>
      <div class="files" id="files"></div>
    </div>
    <div class="hand-zone">
      <div class="hand-row" id="myHand"></div>
      <div class="hand-label" id="myLabel"></div>
    </div>
    <div class="card-info" id="cardInfo"></div>
  </div>

  <div class="panel">
    <div class="card" id="onlineCard"></div>
    <div class="card">
      <div class="turn"><span class="swatch" id="turnSwatch"></span><span id="turnText"></span></div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card">
      <div class="label" data-t="roll"></div>
      <div class="roll" id="roll">—</div>
      <div class="sub" id="rollSub"></div>
    </div>

    <div class="card" id="cardsCard"></div>

    <div class="card">
      <div class="label" data-t="rollChances"></div>
      <div class="king-row"><span class="swatch w"></span><div class="chips" id="oddsW"></div></div>
      <div class="king-row" style="margin-bottom:14px"><span class="swatch b"></span><div class="chips" id="oddsB"></div></div>
      <div class="label" data-t="kingsMoveAs"></div>
      <div class="king-row"><span class="swatch w"></span><div class="chips" id="kingW"></div></div>
      <div class="king-row"><span class="swatch b"></span><div class="chips" id="kingB"></div></div>
    </div>

    <div class="card">
      <div class="side">
        <div class="label" id="capWLabel"></div>
        <div class="captured" id="capW"></div>
      </div>
      <div class="side">
        <div class="label" id="capBLabel"></div>
        <div class="captured" id="capB"></div>
      </div>
    </div>

    <div class="card">
      <div class="label" data-t="moves"></div>
      <div class="log" id="log"></div>
    </div>

    <div class="card rules">
      <details>
        <summary data-t="rulesTitle"></summary>
        <ul id="rulesList"></ul>
      </details>
    </div>

    <button id="newGame"></button>
  </div>
</div>

<div id="fx"></div>

<div class="overlay" id="promo">
  <div class="box">
    <h2 data-t="pawnEndTitle"></h2>
    <p data-t="pawnEndText"></p>
    <div class="promo-grid" id="promoGrid"></div>
  </div>
</div>

<div class="overlay" id="discard">
  <div class="box wide">
    <h2 data-t="discardTitle"></h2>
    <p data-t="discardText"></p>
    <div class="discard-list" id="discardList"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="box">
    <h2 id="overTitle"></h2>
    <p id="overText"></p>
    <div class="row-btns"><button id="overClose" data-t="seeBoard"></button><button id="overNew" class="primary" data-t="playAgain"></button></div>
  </div>
</div>

<script>
const G = window.Game;
const { TYPES, PROMO_TYPES, FILES, key, other, toSquare, isKing, rand, samePos, realType, squares, optionsFor } = G;
const GLYPH = { king: "♚", queen: "♛", rook: "♜", bishop: "♝", knight: "♞", pawn: "♟" };
const VS = "︎"; // force text style so the pawn isn't drawn as an emoji
const LEVELED = new Set(["barricade", "abra", "nomad"]);

// ---------- language ----------
let lang = "en";
try { lang = localStorage.getItem("rc-lang") || ((navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en"); } catch (e) {}
if (!LANGS[lang]) lang = "en";
const L = () => LANGS[lang];
const tx = (k, ...a) => { const v = L()[k]; return typeof v === "function" ? v(...a) : v; };
const colName = c => L().colors[c] || c;
const typName = t => L().types[t] || t;
const cardName = (t, l) => L().cards[t] + (LEVELED.has(t) ? L().lvl(l) : "");
// turn raw log/note arguments into words: "w" -> White, "rook" -> rook
const word = x => x === "w" || x === "b" ? colName(x) : TYPES.includes(x) ? typName(x) : x;

// ---------- state ----------
let S;
let mode = "local";        // "local" (hot-seat) or "online"
let gameCode = null;
let myRole = null;         // "w", "b" or "spectator" when online
let rotateLocal = true;
try { rotateLocal = localStorage.getItem("rc-rotate") !== "0"; } catch (e) {}
let connected = false, opponentHere = false, onlineError = "";
let rolling = false, flash = null, overDismissed = false, restartArmed = null;
let targeting = null;      // { idx } while picking a square for a card

// who is looking at the screen (hot-seat: whoever is moving)
function viewer() { return mode === "online" ? myRole : S.turn; }
function isPlayer(v) { return v === "w" || v === "b"; }
function myTurn() { return !S.over && (mode === "local" || myRole === S.turn); }
// Abracadabra on the viewer: their own pieces look like one type, and the log is hidden
function disguiseOnViewer() { const v = viewer(); return isPlayer(v) ? S.disguise[v] : null; }
function pieceName(p) {
  const d = disguiseOnViewer();
  return colName(p[0]) + " " + (d && p[0] === viewer() ? L().piece : typName(realType(p)));
}
function turnsLeft(until) { return Math.max(1, Math.ceil((until - S.ply) / 2)); }

// ---------- actions (each changes S, then commit() shares it) ----------
function clickSquare(r, c) {
  if (S.over) return;
  if (mode === "online" && myRole !== S.turn) {
    flashMsg(myRole === "spectator" ? tx("msgWatch") : tx("msgWait", colName(S.turn)), true);
    return;
  }
  if (rolling) return;
  if (S.hands[S.turn].length > G.HAND_MAX) { flashMsg(tx("msgDiscard"), true); return; }
  if (targeting) {
    const card = S.hands[S.turn][targeting.idx];
    if (card && G.validTarget(S, card, [r, c])) { const i = targeting.idx; targeting = null; G.useCard(S, i, [r, c]); commit(); }
    else flashMsg(tx("msgBadTarget"), true);
    return;
  }
  if (S.pendingCopy) {
    if (G.placeCopy(S, [r, c])) commit();
    else flashMsg(tx("msgCopy", typName(S.pendingCopy.type)), true);
    return;
  }
  if (S.pendingPromo) { flashMsg(tx("msgPromo"), true); return; }
  if (S.postCard) { flashMsg(tx("msgPost"), true); return; }
  if (S.locked) {
    if (G.makeMove(S, r, c)) return commit();
    flashMsg(tx("msgMustMove", typName(S.locked.roll)), true);
    return;
  }
  const p = squares(S.board)[key(r, c)];
  if (!p) return;
  if (p[0] !== S.turn) { flashMsg(tx("msgWrongColor", colName(p[0]), colName(S.turn)), true); return; }
  if (G.isFrozen(S, p)) { flashMsg(tx("msgFrozen"), true); return; }
  if (S.deadRolls[p]) { flashMsg(tx("msgDead", typName(S.deadRolls[p])), true); return; }

  const roll = rand(optionsFor(p, S));
  const game = S;
  animateRoll(roll, () => {
    if (S !== game) return; // a restart, leave or new online game happened mid-roll
    const name = pieceName(p);
    const result = G.resolveRoll(S, p, roll);
    commit();
    if (result === "dead") flashMsg(tx("msgCantMove", name, typName(roll)), true);
  });
}

function onUseCard(idx) {
  if (!myTurn() || rolling) return;
  if (!G.canUseCard(S)) { flashMsg(tx("msgNoCardNow"), true); return; }
  const card = S.hands[S.turn][idx];
  if (!card) return;
  if (G.cardTarget(card)) { targeting = { idx }; render(); flashMsg(tx("msgTarget", cardName(card.t, card.l))); return; }
  if (G.useCard(S, idx)) commit();
}
function onBuy(i) {
  if (!myTurn() || rolling) return;
  if (!G.canBuy(S)) { flashMsg(tx("msgNoBuyNow"), true); return; }
  if (S.points[S.turn] < G.SHOP[i][2]) { flashMsg(tx("msgPoor"), true); return; }
  if (G.buy(S, i)) commit();
}
function onDiscard(idx) { if (myTurn() && G.discard(S, S.turn, idx)) commit(); }
function onEndPost() { if (myTurn() && G.endPostCard(S)) commit(); }
function onPromotion(type) { if (myTurn() && G.choosePromotion(S, type)) commit(); }

function animateRoll(final, done) {
  rolling = true;
  const el = document.getElementById("roll");
  el.classList.add("rolling");
  let i = 0;
  const timer = setInterval(() => {
    el.textContent = typName(rand(TYPES));
    if (++i >= 8) {
      clearInterval(timer);
      el.classList.remove("rolling");
      rolling = false;
      done();
    }
  }, 45);
}

function restart() {
  S = G.freshState((S ? S.seq : 0) + 1);
  overDismissed = false; flash = null; targeting = null;
  publish(true);
  render();
  runFx(true);
}

// ---------- syncing (WebSocket to your server) ----------
function commit() {
  S.seq++;
  selCard = null;
  flash = null;
  if (targeting && !G.canUseCard(S)) targeting = null;
  publish(false);
  render();
  runFx();
}
function publish(isRestart) {
  if (mode === "online" && myRole !== "spectator") send({ type: "state", state: S, restart: !!isRestart });
}

let ws = null;
function randomId(n) {
  return Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
}
function playerId() {
  try {
    let id = localStorage.getItem("rc-player");
    if (!id) { id = randomId(20); localStorage.setItem("rc-player", id); }
    return id;
  } catch (e) {
    return window._rcPlayer || (window._rcPlayer = randomId(20));
  }
}
function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

function openSocket(firstMessage) {
  if (ws) { ws.onclose = null; ws.close(); }
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  const sock = new WebSocket(url);
  ws = sock;
  sock.onopen = () => { connected = true; onlineError = ""; send(firstMessage()); render(); };
  sock.onmessage = e => { try { handleServer(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  sock.onclose = () => {
    if (ws !== sock) return;
    connected = false; opponentHere = false;
    render();
    setTimeout(() => {
      if (ws === sock && mode === "online" && gameCode) {
        openSocket(() => ({ type: "join", code: gameCode, playerId: playerId() }));
      }
    }, 2000);
  };
}

function handleServer(m) {
  if (m.type === "joined") {
    if (!G.valid(m.state)) return;
    gameCode = m.code;
    myRole = m.role;
    S = m.state;
    overDismissed = false; targeting = null;
    if (location.hash !== "#play-" + m.code) location.hash = "play-" + m.code;
    render(); runFx(true); return;
  } else if (m.type === "state") {
    if (!G.valid(m.state) || rolling) return;
    if (m.state.seq <= S.seq && !m.force) return;
    const wasOver = !!S.over;
    S = m.state;
    if (!S.over || !wasOver) overDismissed = false;
    flash = null;
    if (targeting && !(myTurn() && G.canUseCard(S))) targeting = null;
    render(); runFx(); return;
  } else if (m.type === "peers") {
    opponentHere = myRole === "w" ? !!m.b : myRole === "b" ? !!m.w : !!(m.w && m.b);
  } else if (m.type === "error") {
    onlineError = String(m.message || "Something went wrong.");
    if (m.fatal) { mode = "online"; gameCode = null; }
  }
  render();
}

function createOnline() {
  mode = "online";
  myRole = null; gameCode = null; onlineError = ""; targeting = null;
  S = G.freshState(1);
  overDismissed = false;
  render();
  openSocket(() => ({ type: "create", playerId: playerId(), state: S }));
}
function connectOnline(code) {
  mode = "online";
  gameCode = code; myRole = null; onlineError = ""; targeting = null;
  S = G.freshState(0);
  render();
  openSocket(() => ({ type: "join", code, playerId: playerId() }));
}
function leaveOnline() {
  if (ws) { const s = ws; ws = null; s.onclose = null; s.close(); }
  gameCode = null; myRole = null; mode = "local"; targeting = null;
  connected = false; opponentHere = false; onlineError = "";
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; }
  S = G.freshState();
  overDismissed = false;
  render();
}
function readHash() {
  const m = location.hash.match(/^#play-([a-z0-9]{6,16})$/);
  if (m && m[1] !== gameCode) connectOnline(m[1]);
}

// ---------- rendering ----------
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
function flashMsg(text, warn) { flash = { text, warn }; renderMsg(); }

function noteText(n) { return n ? tx(n.k, ...n.a.map(word)) : ""; }

function renderMsg() {
  const el = document.getElementById("msg");
  const mover = myTurn();
  let text, warn = false;
  if (flash) { text = flash.text; warn = flash.warn; }
  else if (S.over) { const [a, b] = overText(); text = `${a} ${b}`; }
  else if (!mover) {
    if (S.pendingPromo) text = tx("msgPromoOpp", colName(S.turn));
    else if (S.pendingCopy) text = tx("msgCopyOpp", colName(S.turn));
    else if (S.postCard) text = tx("msgPostOpp", colName(S.turn));
    else {
      text = myRole === "spectator" ? tx("msgWatch") : tx("msgWaiting", colName(S.turn));
      if (S.note) { text = noteText(S.note) + " " + text; warn = true; }
    }
  }
  else if (S.hands[S.turn].length > G.HAND_MAX) { text = tx("msgDiscard"); warn = true; }
  else if (targeting) { const c = S.hands[S.turn][targeting.idx]; text = c ? tx("msgTarget", cardName(c.t, c.l)) : ""; }
  else if (S.pendingCopy) text = tx("msgCopy", typName(S.pendingCopy.type));
  else if (S.pendingPromo) text = tx("msgPromo");
  else if (S.postCard) text = tx("msgPost");
  else if (S.locked) text = tx("msgLocked", pieceName(S.locked.piece), toSquare(S.board[S.locked.piece]), typName(S.locked.roll));
  else {
    const base = G.canUseCard(S) && S.hands[S.turn].length ? tx("msgClick") : tx("msgClickNoCard");
    if (S.note) { text = noteText(S.note) + " " + base; warn = true; } else text = base;
  }
  el.textContent = text;
  el.className = "msg" + (warn ? " warn" : "");
}

function overText() {
  const o = S.over;
  if (o.k === "raw") return [o.title, o.text];
  return L().over[o.k](colName(o.w));
}

function logText(e) {
  const v = viewer(), a = e.a;
  const hide = e.o && isPlayer(v) && e.o !== v;   // someone else's private card info
  const lg = L().log;
  switch (e.k) {
    case "got": return hide ? lg.gotHidden(colName(a[0])) : lg.got(colName(a[0]), cardName(a[1], a[2]), L().reasons[a[3]] || "");
    case "bought": return hide ? lg.boughtHidden(colName(a[0])) : lg.bought(colName(a[0]), cardName(a[1], a[2]), a[3]);
    case "discarded": return hide ? lg.discardedHidden(colName(a[0])) : lg.discarded(colName(a[0]), cardName(a[1], a[2]));
    case "useBarricade": return lg.useBarricade(colName(a[0]), cardName("barricade", a[1]), a[2], a[3] ? colName(a[3]) : "");
    case "useAbra": return lg.useAbra(colName(a[0]), cardName("abra", a[1]));
    case "useNomad": return lg.useNomad(colName(a[0]), cardName("nomad", a[1]));
    case "over": return lg.over(a[0], colName(a[1]));
  }
  return lg[e.k] ? lg[e.k](...a.map(word)) : e.k;
}

function glyphHtml(type, col, extra = "") {
  return `<span class="piece ${col} ${extra}">${GLYPH[type]}${VS}</span>`;
}
// how a board piece looks to the viewer (Abracadabra changes the viewer's own pieces)
function boardGlyph(p, extra) {
  const d = disguiseOnViewer();
  let t = realType(p);
  if (d && p[0] === viewer()) {
    if (!isKing(p)) t = d.type;
    else if (d.type === "king") extra += " gold";
  }
  return glyphHtml(t, p[0], extra);
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = tx(el.dataset.t); });
  document.getElementById("rulesList").innerHTML = L().rules.map(r => `<li>${esc(r)}</li>`).join("");
  document.getElementById("promoGrid").innerHTML = PROMO_TYPES.map(t =>
    `<button data-type="${t}"><span class="g">${GLYPH[t]}${VS}</span>${esc(typName(t))}</button>`).join("");
}

function render() {
  const v = viewer(), mover = myTurn(), dis = disguiseOnViewer();
  const flipped = mode === "online" ? myRole === "b" : rotateLocal && S.turn === "b";
  const occ = squares(S.board);
  const moveSet = new Set((S.locked && !targeting ? S.locked.moves : []).map(m => key(...m)));
  const copySet = new Set((S.pendingCopy && mover ? S.pendingCopy.squares : []).map(m => key(...m)));
  const lockMap = new Map(S.locks.map(l => [key(...l.sq), l]));
  const mineSet = new Set(S.mines.filter(m => m.by === v && m.at === S.ply && isPlayer(v)).map(m => key(...m.sq)));
  const targetCard = targeting ? S.hands[S.turn][targeting.idx] : null;
  const kingPos = S.board[S.turn + "_king"];
  const sel = S.locked ? S.board[S.locked.piece] : null;

  let html = "";
  for (let dr = 0; dr < 8; dr++) {
    for (let dc = 0; dc < 8; dc++) {
      const r = flipped ? 7 - dr : dr, c = flipped ? 7 - dc : dc, k = key(r, c);
      const p = occ[k];
      const cls = ["sq", (r + c) % 2 ? "dark" : "light"];
      if (sel && sel[0] === r && sel[1] === c) cls.push("selected");
      if (S.checked && kingPos && kingPos[0] === r && kingPos[1] === c) cls.push("check");
      const lock = lockMap.get(k);
      if (lock) cls.push("locked");
      if (targetCard && G.validTarget(S, targetCard, [r, c])) cls.push("target");
      let inner = "";
      if (p) inner += boardGlyph(p, (S.deadRolls[p] ? "dead" : "") + (lock && !isKing(p) ? " frozen" : ""));
      if (lock) inner += `<span class="lock-n">${turnsLeft(lock.until)}</span>`;
      if (mineSet.has(k)) inner += '<span class="mine-mark">✹</span>';
      if (moveSet.has(k)) inner += p ? '<span class="ring"></span>' : '<span class="dot"></span>';
      if (copySet.has(k)) inner += '<span class="dot gold"></span>';
      html += `<div class="${cls.join(" ")}" data-r="${r}" data-c="${c}">${inner}</div>`;
    }
  }
  document.getElementById("board").innerHTML = html;
  const ranks = [8,7,6,5,4,3,2,1], files = [...FILES];
  if (flipped) { ranks.reverse(); files.reverse(); }
  document.getElementById("ranks").innerHTML = ranks.map(n => `<div>${n}</div>`).join("");
  document.getElementById("files").innerHTML = files.map(f => `<div>${f}</div>`).join("");

  // turn
  document.getElementById("turnSwatch").className = "swatch " + S.turn;
  let turnText = S.over ? tx("gameOver") : tx("toMove", colName(S.turn));
  if (!S.over && mode === "online" && myRole === S.turn) turnText = tx("yourTurn", colName(S.turn));
  document.getElementById("turnText").textContent = turnText;
  renderMsg();

  // roll
  if (!rolling) {
    const rollEl = document.getElementById("roll"), sub = document.getElementById("rollSub");
    if (S.locked) { rollEl.textContent = typName(S.locked.roll); sub.textContent = `${pieceName(S.locked.piece)} · ${toSquare(S.board[S.locked.piece])}`; }
    else if (S.lastRoll && S.board[S.lastRoll.piece]) { rollEl.textContent = typName(S.lastRoll.roll); sub.textContent = `${pieceName(S.lastRoll.piece)} ✗`; }
    else { rollEl.textContent = "—"; sub.textContent = ""; }
  }

  for (const col of ["w", "b"]) {
    const C = col.toUpperCase();
    document.getElementById("king" + C).innerHTML = TYPES.map(t =>
      `<span class="chip ${S.kingOptions[col].includes(t) ? "" : "lost"}">${esc(typName(t))}</span>`).join("");
    document.getElementById("cap" + C + "Label").textContent = tx("capturedBy", colName(col));
    const caps = S.captured[col];
    document.getElementById("cap" + C).innerHTML = dis
      ? `<span class="none">${esc(tx("hiddenAbra"))}</span>`
      : caps.length ? caps.map(p => glyphHtml(realType(p), p[0])).join("") : `<span class="none">${esc(tx("nothingYet"))}</span>`;
    const list = S.rollLists[col];
    document.getElementById("odds" + C).innerHTML = TYPES.map(t => {
      const n = list.filter(x => x === t).length;
      return `<span class="chip">${esc(typName(t))}${n > 1 ? " ×" + n : ""} · ${Math.round(n / list.length * 100)}%</span>`;
    }).join("");
  }

  const logEl = document.getElementById("log");
  logEl.textContent = "";
  const lines = dis ? [tx("hiddenAbra")] : S.log.length ? S.log.map(logText) : [tx("noMoves")];
  for (const line of lines) { const d = document.createElement("div"); d.textContent = line; logEl.appendChild(d); }

  // game over popup
  const ov = document.getElementById("overlay");
  if (S.over && !overDismissed) {
    const [a, b] = overText();
    document.getElementById("overTitle").textContent = a;
    document.getElementById("overText").textContent = b;
    ov.classList.add("show");
  } else ov.classList.remove("show");

  // discard (more than 7 cards) comes before everything else for the mover
  const mustDiscard = mover && S.hands[S.turn].length > G.HAND_MAX;
  document.getElementById("discard").classList.toggle("show", mustDiscard);
  if (mustDiscard) {
    document.getElementById("discardList").innerHTML = S.hands[S.turn].map((c, i) => cardFace(c, "", `data-discard="${i}"`)).join("");
  }
  document.getElementById("promo").classList.toggle("show", !!(S.pendingPromo && mover && !mustDiscard));

  const ng = document.getElementById("newGame");
  ng.textContent = restartArmed ? tx("clickAgain") : tx("newGame");
  ng.style.display = mode === "online" && myRole === "spectator" ? "none" : "";

  renderCards();
  renderHands();
  renderShop();
  renderOnline();
}

function renderCards() {
  const v = viewer(), mover = myTurn();
  const el = document.getElementById("cardsCard");
  let h = `<div class="label">${esc(tx("cardsTitle"))}</div><div class="stats">`;
  for (const col of ["w", "b"]) {
    const won = S.nomadWon[col], d = S.dist[col];
    const dist = won >= 2 ? tx("allWanderers", d) : tx("nextWanderer", d, G.NOMAD_AT[won], won === 0 ? "I" : "II");
    h += `<span class="swatch ${col}"></span><div><b>${esc(tx("points", S.points[col]))}</b> · ${esc(tx("oppHand", colName(col), S.hands[col].length))}
      <div class="muted">${esc(dist)} · ${esc(tx("pointsCap", S.earned[col]))}</div></div>`;
  }
  h += `</div><div class="small">${esc(tx("nextDraw", G.DRAW_EVERY - (S.ply % G.DRAW_EVERY)))}</div>`;

  // active effects
  const fx = S.locks.map(l => tx("lockEffect", toSquare(l.sq), turnsLeft(l.until)));
  for (const col of ["w", "b"]) {
    const d = S.disguise[col];
    if (d) fx.push(col === v ? tx("abraOnYou", turnsLeft(d.until)) : tx("abraOn", colName(col), turnsLeft(d.until)));
  }
  if (isPlayer(v)) for (const m of S.mines) if (m.by === v && m.at === S.ply) fx.push(tx("yourMine", toSquare(m.sq)));
  h += `<div class="label" style="margin-top:12px">${esc(tx("effects"))}</div><div class="effects">${fx.length ? fx.map(x => `<div>${esc(x)}</div>`).join("") : `<div class="small" style="margin:0">${esc(tx("noEffects"))}</div>`}</div>`;

  el.innerHTML = h;
}

// ---------- cards on screen ----------
const ART = {
  barricade: `<rect x="15" y="29" width="34" height="25" rx="5" fill="currentColor"/><path d="M21 29v-8a11 11 0 0 1 22 0v8" fill="none" stroke="currentColor" stroke-width="5.5"/><circle cx="32" cy="39.5" r="4" fill="#0d2347"/><rect x="30.3" y="41" width="3.4" height="7.5" rx="1.5" fill="#0d2347"/>`,
  abra: `<path d="M13 52L39 26" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><path d="M39 26l5-5" stroke="#ffe27a" stroke-width="6" stroke-linecap="round"/><path d="M46 7l2.6 6 6.4.6-4.8 4.3 1.4 6.3-5.6-3.3-5.6 3.3 1.4-6.3-4.8-4.3 6.4-.6z" fill="#ffe27a"/><circle cx="20" cy="18" r="2.6" fill="currentColor"/><circle cx="52" cy="36" r="2.2" fill="currentColor"/><circle cx="28" cy="10" r="1.6" fill="currentColor"/>`,

function cardFace(c, extra = "", attrs = "") {
  const lv = LEVELED.has(c.t) ? ["I", "II", "III"][c.l - 1] : "★";
  return `<div class="gcard k-${c.t} ${extra}" ${attrs} title="${esc(cardName(c.t, c.l))}">
    <div class="cname">${esc(L().cards[c.t])}</div>

function cardBack() { return `<div class="gcard back" title="${esc(tx("cardBack"))}"><span class="emblem">♞${VS}</span></div>`; }

let selCard = null;   // index of the card picked in the viewer's hand

// your cards under the board, the other side's cards (face down) above it
function renderHands() {
  const v = viewer(), mover = myTurn();
  const bottom = isPlayer(v) ? v : (mode === "online" ? "w" : S.turn);
  const top = other(bottom);
  const showFaces = isPlayer(v);
  const topHand = S.hands[top], botHand = S.hands[bottom];
  document.getElementById("oppLabel").innerHTML = `<span class="swatch ${top}"></span>${esc(tx("handLabel", colName(top), topHand.length))}`;
  document.getElementById("myLabel").innerHTML = `<span class="swatch ${bottom}"></span>${esc(tx("handLabel", colName(bottom), botHand.length))}`;
  document.getElementById("oppHand").innerHTML = topHand.length ? topHand.map(cardBack).join("") : `<span class="hand-empty">${esc(tx("noCards"))}</span>`;
  if (selCard !== null && !botHand[selCard]) selCard = null;
  const usable = mover && G.canUseCard(S) && !rolling;
  document.getElementById("myHand").innerHTML = !botHand.length ? `<span class="hand-empty">${esc(tx("noCards"))}</span>`
    : showFaces ? botHand.map((c, i) => cardFace(c, (selCard === i || (targeting && targeting.idx === i) ? "sel" : "") + (usable ? "" : " off"), `data-card="${i}"`)).join("")
    : botHand.map(cardBack).join("");

  // info strip: what the picked card does, Use / Cancel, End turn after a capture
  const info = document.getElementById("cardInfo");
  let txt = "", btns = "";
  const picked = showFaces && selCard !== null ? botHand[selCard] : null;
  if (targeting) {
    const c = S.hands[S.turn][targeting.idx];
    txt = `<b>${esc(c ? cardName(c.t, c.l) : "")}</b>${esc(tx("msgTarget", c ? cardName(c.t, c.l) : ""))}`;
    btns = `<button id="cancelTarget">${esc(tx("cancel"))}</button>`;
  } else if (picked) {
    txt = `<b>${esc(cardName(picked.t, picked.l))}</b>${esc(L().cardDesc[picked.t](picked.l))}`;
    btns = (mover ? `<button class="primary" id="useCard" ${usable ? "" : "disabled"}>${esc(tx("use"))}</button>` : "") + `<button id="closeCard">${esc(tx("close"))}</button>`;
    if (mover && !usable) txt += `<br><span style="color:var(--red)">${esc(tx("msgNoCardNow"))}</span>`;
  } else if (showFaces && botHand.length) txt = esc(tx("pickCard"));
  else txt = esc(tx("noCards"));
  if (S.postCard && mover) btns += `<button class="primary" id="endPostBtn">${esc(tx("endTurn"))}</button>`;
  info.innerHTML = `<div class="txt">${txt}</div><div class="btns">${btns}</div>`;
}

function renderShop() {
  const v = viewer(), el = document.getElementById("shopPanel");
  let h = `<div class="label">${esc(tx("shopTitle"))}</div>`;
  if (!isPlayer(v)) { el.innerHTML = h + `<div class="small">${esc(tx("watchingShop"))}</div>`; return; }
  const canShop = myTurn() && G.canBuy(S) && !rolling;
  h += `<div class="shop-points">${esc(tx("shopPoints", S.points[v]))}</div>
    <div class="small" style="margin-top:2px">${esc(tx("pointsCap", S.earned[v]))}</div>

  G.SHOP.forEach(([t, l, price], i) => {
    h += `<div class="shop-item">${cardFace({ t, l })}<div class="nm">${esc(cardName(t, l))}</div>
      <button data-buy="${i}" ${canShop && S.points[v] >= price ? "" : "disabled"}>${esc(tx("buyFor", price))}</button></div>`;
  });
  h += `</div><div class="small">${esc(tx("shopHint"))} ${esc(tx("notForSale"))}</div>`;

}

function renderOnline() {
  const card = document.getElementById("onlineCard");
  const langBtn = `<button class="lang-btn" id="langBtn">${esc(tx("lang"))}</button>`;
  if (mode === "local") {
    card.innerHTML = `
      <div class="top-row"><div class="label" style="margin:0">${esc(tx("play"))}</div>${langBtn}</div>
      <div class="who">${esc(tx("onDevice"))}</div>
      <div class="small">${esc(tx("onDeviceHint"))}</div>
      <label class="small" style="display:flex;gap:8px;align-items:center;cursor:pointer">
        <input type="checkbox" id="rotateBox" ${rotateLocal ? "checked" : ""}> ${esc(tx("rotate"))}
      </label>
      <div class="row-btns"><button class="primary" id="createBtn">${esc(tx("createOnline"))}</button></div>`;
    document.getElementById("createBtn").onclick = createOnline;
    document.getElementById("rotateBox").onchange = e => {
      rotateLocal = e.target.checked;
      try { localStorage.setItem("rc-rotate", rotateLocal ? "1" : "0"); } catch (err) {}
      render();
    };
  } else {
    const link = gameCode ? `${location.origin}${location.pathname}#play-${gameCode}` : "";
    let led = "", status;
    if (onlineError) status = onlineError;
    else if (!connected) { led = "wait"; status = tx("connecting"); }
    else if (!myRole) { led = "wait"; status = tx("joining"); }
    else if (opponentHere) { led = "on"; status = tx("oppConnected"); }
    else { led = "wait"; status = tx("waitingOpp"); }
    const you = isPlayer(myRole) ? tx("youPlay", colName(myRole)) : myRole === "spectator" ? tx("youWatch") : tx("onlineGame");
    card.innerHTML = `
      <div class="top-row"><div class="label" style="margin:0">${esc(tx("onlineGame"))}</div>${langBtn}</div>
      <div class="who">${esc(you)}</div>
      <div class="status"><span class="led ${led}"></span><span>${esc(status)}</span></div>
      <div class="online-row">
        <input id="linkBox" readonly>
        <button id="copyBtn">${esc(tx("copyLink"))}</button>
      </div>
      <div class="small">${esc(myRole === "w" ? tx("sendLink") : tx("watchLink"))}</div>
      <div class="row-btns"><button id="leaveBtn">${esc(tx("leave"))}</button></div>`;
    const box = document.getElementById("linkBox");
    box.value = link;
    box.onclick = () => box.select();
    document.getElementById("copyBtn").onclick = e => {
      const btn = e.currentTarget;
      navigator.clipboard.writeText(link)
        .then(() => { btn.textContent = tx("copied"); setTimeout(() => btn.textContent = tx("copyLink"), 1500); })
        .catch(() => { box.select(); btn.textContent = tx("pressCtrlC"); });
    };
    document.getElementById("leaveBtn").onclick = leaveOnline;
  }
  document.getElementById("langBtn").onclick = () => {
    lang = lang === "tr" ? "en" : "tr";
    try { localStorage.setItem("rc-lang", lang); } catch (e) {}
    applyStatic();
    render();
  };
}

// ---------- animations ----------
// Every log entry has a running number (n). After each new state, entries we haven't animated yet are
// played in order, on this device and on the opponent's. Animations never block the game.
const FXL = document.getElementById("fx");
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let fxSeen = 0, fxChain = Promise.resolve();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const T = (x, y, extra = "") => `translate(-50%, -50%) translate(${x}px, ${y}px) ${extra}`;
const rnd = (a, b) => a + Math.random() * (b - a);

function fxNode(html, cls, x, y, style = "") {
  const d = document.createElement("div");
  d.className = "fx " + cls;
  d.style.cssText = style;
  d.innerHTML = html;
  d.style.transform = T(x, y);
  FXL.appendChild(d);
  return d;
}
function play(node, frames, opts) {
  const a = node.animate(frames, { fill: "forwards", easing: "ease-out", ...opts });
  return a.finished.catch(() => {}).then(() => node);
}
const remove = n => n && n.remove();
function center(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; }
function sqPos(name) {
  const c = FILES.indexOf(name[0]), r = 8 - +name.slice(1);
  const el = document.querySelector(`.sq[data-r="${r}"][data-c="${c}"]`);
  return el ? center(el) : boardPos();
}
function boardPos() { return center(document.getElementById("board")); }
function bottomColor() { const v = viewer(); return isPlayer(v) ? v : (mode === "online" ? "w" : S.turn); }
function handPos(col) { return center(document.getElementById(col === bottomColor() ? "myHand" : "oppHand")); }
function shopPos() { return center(document.getElementById("shopPanel")); }
function canSeeCard(col) { const v = viewer(); return !isPlayer(v) || v === col; }
function flyCard(card, hidden) {
  const cls = "fx-card" + (hidden ? "" : " k-" + card.t);
  return fxNode(hidden ? cardBack() : cardFace(card), cls, 0, 0);
}
function particles(n, x, y, make, spread, ms) {
  const all = [];
  for (let i = 0; i < n; i++) {
    const ang = rnd(0, Math.PI * 2), dist = rnd(spread * .4, spread);
    const p = make(i);
    p.style.transform = T(x, y);
    all.push(play(p, [
      { transform: T(x, y, "scale(.4)"), opacity: 1 },
      { transform: T(x + Math.cos(ang) * dist, y + Math.sin(ang) * dist, `scale(${rnd(.6, 1.3)}) rotate(${rnd(-200, 200)}deg)`), opacity: 0 },
    ], { duration: ms * rnd(.7, 1.1), easing: "cubic-bezier(.2,.7,.3,1)" }).then(remove));
  }
  return Promise.all(all);
}
const dot = color => () => fxNode("", "fx-dot", 0, 0, `background:${color};box-shadow:0 0 8px ${color}`);
const star = (chars, colors) => () => fxNode(rand(chars), "fx-star", 0, 0, `color:${rand(colors)}`);
function boardFlash(color, ms = 700) {
  const b = document.getElementById("board").getBoundingClientRect();
  const w = fxNode("", "fx-wash", 0, 0, `left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px;background:radial-gradient(circle, ${color}, transparent 75%)`);
  w.style.transform = "none";
  return play(w, [{ opacity: 0 }, { opacity: 1, offset: .35 }, { opacity: 0 }], { duration: ms }).then(remove);
}
function boardClass(cls, ms) {
  const b = document.getElementById("board");
  b.classList.remove(cls); void b.offsetWidth; b.classList.add(cls);
  setTimeout(() => b.classList.remove(cls), ms);
}

// --- getting a card: each kind arrives its own way, then flies into its owner's hand ---
async function fxGot(col, card, why) {
  const hidden = !canSeeCard(col);
  const from = why === "bought" ? shopPos() : boardPos(), to = handPos(col);
  const n = flyCard(card, hidden);
  const { x, y } = from;
  const entrance = hidden ? [
    { transform: T(x, y, "scale(.2) rotateY(180deg)"), opacity: 0 },
    { transform: T(x, y, "scale(1) rotateY(0)"), opacity: 1 },
  ] : {
    barricade: [ // drops in from above with a heavy thud
      { transform: T(x, y - 220, "scale(1.1)"), opacity: 0 },
      { transform: T(x, y + 8, "scale(1.15, .9)"), opacity: 1, offset: .7 },
      { transform: T(x, y, "scale(1)"), opacity: 1 },
    ],
    abra: [ // spirals in like a spell
      { transform: T(x - 120, y + 60, "scale(.1) rotate(-540deg)"), opacity: 0 },
      { transform: T(x, y, "scale(1.1) rotate(10deg)"), opacity: 1, offset: .8 },
      { transform: T(x, y, "scale(1) rotate(0)"), opacity: 1 },
    ],
    mine: [ // pops up and rattles
      { transform: T(x, y, "scale(0)"), opacity: 0 },
      { transform: T(x, y, "scale(1.25)"), opacity: 1, offset: .45 },
      { transform: T(x - 6, y, "scale(1) rotate(-6deg)"), offset: .6 },
      { transform: T(x + 6, y, "scale(1) rotate(6deg)"), offset: .75 },
      { transform: T(x, y, "scale(1)"), opacity: 1 },
    ],
    reborn: [ // rises from below, glowing
      { transform: T(x, y + 160, "scale(.8)"), opacity: 0, filter: "brightness(2.5) blur(6px)" },
      { transform: T(x, y, "scale(1)"), opacity: 1, filter: "brightness(1) blur(0)" },
    ],
    nomad: [ // rolls in sideways like a wheel
      { transform: T(x - 260, y, "scale(.8) rotate(-720deg)"), opacity: 0 },
      { transform: T(x, y, "scale(1) rotate(0)"), opacity: 1 },
    ],
  }[card.t];
  if (!hidden && card.t === "abra") particles(10, x, y, star(["✦", "✧", "★"], ["#d9b3ff", "#ffe27a"]), 90, 700);
  if (!hidden && card.t === "reborn") particles(8, x, y + 40, dot("#7dffb5"), 70, 800);
  await play(n, entrance, { duration: 650, easing: "cubic-bezier(.2,.8,.3,1)" });
  await sleep(220);
  await play(n, [
    { transform: T(x, y, "scale(1)"), opacity: 1 },
    { transform: T(to.x, to.y, "scale(.7)"), opacity: .2 },
  ], { duration: 420, easing: "ease-in" });
  remove(n);
}

// card leaves its owner's hand and travels to (x, y)
async function cardTo(col, card, x, y, ms = 480, endScale = .9) {
  const from = handPos(col), n = flyCard(card, false);
  await play(n, [
    { transform: T(from.x, from.y, "scale(.8)"), opacity: .4 },
    { transform: T(x, y, `scale(${endScale})`), opacity: 1 },
  ], { duration: ms, easing: "cubic-bezier(.3,.7,.3,1)" });
  return n;
}

async function fxBarricade(col, l, sqName) {
  const p = sqPos(sqName), card = { t: "barricade", l };
  const n = await cardTo(col, card, p.x, p.y - 30);
  await play(n, [{ transform: T(p.x, p.y - 30, "scale(.9)"), opacity: 1 }, { transform: T(p.x, p.y, "scale(.2)"), opacity: 0 }], { duration: 220, easing: "ease-in" });
  remove(n);
  // iron bars slam down onto the square, then a lock snaps shut
  const bars = [-0.3, 0, 0.3].map((f, i) => {
    const b = fxNode("", "fx-bar", 0, 0, `height:${p.h * .95}px;width:${p.w * .14}px`);
    return play(b, [
      { transform: T(p.x + f * p.w, p.y - p.h * 2), opacity: 0 },
      { transform: T(p.x + f * p.w, p.y + 4), opacity: 1, offset: .75 },
      { transform: T(p.x + f * p.w, p.y), opacity: 1 },
    ], { duration: 360, delay: i * 90, easing: "cubic-bezier(.5,0,.7,1.4)" });
  });
  const done = await Promise.all(bars);
  boardClass("fx-shake", 300);
  const lock = fxNode(`<svg viewBox="0 0 64 64" width="${p.w * .7}" height="${p.w * .7}">${ART.barricade}</svg>`, "fx-lock", p.x, p.y);
  await play(lock, [
    { transform: T(p.x, p.y, "scale(0)"), opacity: 0 },
    { transform: T(p.x, p.y, "scale(1.35)"), opacity: 1, offset: .5 },
    { transform: T(p.x, p.y, "scale(1)"), opacity: 1 },
  ], { duration: 380 });
  await sleep(350);
  await Promise.all([lock, ...done].map(x => play(x, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 })));
  [lock, ...done].forEach(remove);
}

async function fxAbra(col, l) {
  const b = boardPos(), card = { t: "abra", l };
  const n = await cardTo(col, card, b.x, b.y, 500, 1.1);
  // the card spins faster and faster, then bursts into stars and the pieces shimmer
  await play(n, [
    { transform: T(b.x, b.y, "scale(1.1) rotateY(0)"), filter: "brightness(1)" },
    { transform: T(b.x, b.y, "scale(1.6) rotateY(1080deg)"), filter: "brightness(2.2)" },
  ], { duration: 700, easing: "ease-in" });
  remove(n);
  boardFlash("rgba(176,114,242,.55)", 900);
  boardClass("fx-magic", 900);
  await particles(28, b.x, b.y, star(["✦", "✧", "★", "✶"], ["#d9b3ff", "#b072f2", "#ffe27a", "#fff"]), b.w * .55, 900);
}

async function fxMine(col, sqName) {
  const mine = viewer() === col && isPlayer(col) && sqName;
  if (mine) {
    // the owner sees the mine being buried in its square
    const p = sqPos(sqName);
    const n = await cardTo(col, { t: "mine", l: 1 }, p.x, p.y - 20);
    await play(n, [
      { transform: T(p.x, p.y - 20, "scale(.9) rotate(0)"), opacity: 1 },
      { transform: T(p.x, p.y, "scale(.25) rotate(540deg)"), opacity: .9, offset: .7 },
      { transform: T(p.x, p.y + 6, "scale(.05) rotate(720deg)"), opacity: 0 },
    ], { duration: 650, easing: "ease-in" });
    remove(n);
    const ring = fxNode("", "fx-ring", p.x, p.y, `width:${p.w * .9}px;height:${p.w * .9}px;color:#8a5a2b`);
    particles(8, p.x, p.y, dot("#8a5a2b"), p.w * .7, 500);
    await play(ring, [{ transform: T(p.x, p.y, "scale(.2)"), opacity: 1 }, { transform: T(p.x, p.y, "scale(1.4)"), opacity: 0 }], { duration: 500 });
    remove(ring);
  } else {
    // everyone else only sees it vanish into smoke: where it went stays secret
    const b = boardPos(), from = handPos(col);
    const n = flyCard({ t: "mine", l: 1 }, true);
    await play(n, [{ transform: T(from.x, from.y, "scale(.8)"), opacity: .4 }, { transform: T(b.x, b.y, "scale(1)"), opacity: 1 }], { duration: 450 });
    const q = fxNode("?", "fx-banner", b.x, b.y, "color:#ff7a6b;font-size:44px;padding:6px 20px");
    play(q, [{ transform: T(b.x, b.y, "scale(.4)"), opacity: 0 }, { transform: T(b.x, b.y, "scale(1)"), opacity: 1, offset: .4 }, { transform: T(b.x, b.y - 30, "scale(1.1)"), opacity: 0 }], { duration: 1000 }).then(remove);
    particles(14, b.x, b.y, () => fxNode("", "fx-smoke", 0, 0), 110, 1000);
    await play(n, [{ opacity: 1, filter: "blur(0)" }, { opacity: 0, filter: "blur(10px)" }], { duration: 600 });
    remove(n);
  }
}

async function fxReborn(col) {
  const b = boardPos(), card = { t: "reborn", l: 1 };
  const n = await cardTo(col, card, b.x, b.y, 480, 1);
  // the card fades into a green glow, and spirits rise from all over the board
  await play(n, [{ transform: T(b.x, b.y, "scale(1)"), opacity: 1, filter: "brightness(1)" }, { transform: T(b.x, b.y - 60, "scale(1.3)"), opacity: 0, filter: "brightness(3) blur(8px)" }], { duration: 600 });
  remove(n);
  boardFlash("rgba(69,217,138,.45)", 1000);
  const wisps = [];
  for (let i = 0; i < 14; i++) {
    const x = b.x + rnd(-b.w / 2, b.w / 2) * .9, y = b.y + rnd(-b.h / 2, b.h / 2) * .9;

    wisps.push(play(w, [
      { transform: T(x, y, "scale(.3)"), opacity: 0 },
      { transform: T(x + rnd(-10, 10), y - 30, "scale(1)"), opacity: 1, offset: .4 },
      { transform: T(x + rnd(-20, 20), y - 90, "scale(.6)"), opacity: 0 },
    ], { duration: 1100, delay: rnd(0, 400), easing: "ease-in-out" }).then(remove));
  }
  await Promise.all(wisps);
}

async function fxNomad(col, l) {
  const b = boardPos(), card = { t: "nomad", l };
  const n = await cardTo(col, card, b.x, b.y, 480, 1.05);
  // the compass card spins like a needle finding north, with golden rays
  const rays = fxNode("", "fx-ring", b.x, b.y, `width:170px;height:170px;border:none;background:repeating-conic-gradient(rgba(246,211,107,.55) 0 8deg, transparent 8deg 24deg)`);
  play(rays, [{ transform: T(b.x, b.y, "scale(.3) rotate(0)"), opacity: 0 }, { transform: T(b.x, b.y, "scale(1.2) rotate(180deg)"), opacity: 1, offset: .5 }, { transform: T(b.x, b.y, "scale(1.6) rotate(360deg)"), opacity: 0 }], { duration: 1100 }).then(remove);
  await play(n, [
    { transform: T(b.x, b.y, "scale(1.05) rotate(0)") },
    { transform: T(b.x, b.y, "scale(1.15) rotate(400deg)"), offset: .6 },
    { transform: T(b.x, b.y, "scale(1.1) rotate(350deg)"), offset: .8 },
    { transform: T(b.x, b.y, "scale(.2) rotate(360deg)"), opacity: 0 },
  ], { duration: 1000, easing: "ease-in-out" });
  remove(n);
}

async function fxBoom(sqName, big) {
  const p = sqPos(sqName), size = p.w * (big ? 2.4 : 1.6);
  const b = fxNode("", "fx-boom", p.x, p.y, `width:${size}px;height:${size}px`);
  boardClass("fx-shake", 450);
  particles(big ? 18 : 10, p.x, p.y, dot(rand(["#ffb02e", "#ff4d1f", "#fff2a8"])), size * .9, 700);
  await play(b, [{ transform: T(p.x, p.y, "scale(.1)"), opacity: 1 }, { transform: T(p.x, p.y, "scale(1)"), opacity: .9, offset: .4 }, { transform: T(p.x, p.y, "scale(1.3)"), opacity: 0 }], { duration: 650 });
  remove(b);
}

async function fxCopy(sqName, thenBoom) {
  const p = sqPos(sqName);
  const pil = fxNode("", "fx-pillar", p.x, p.y, `width:${p.w * .8}px;height:${p.h * 2.6}px`);
  // the pillar grows up out of the square (anchored at its bottom)
  const y = p.y - p.h * 1.3 + p.h * .5;
  particles(10, p.x, p.y, dot("#a6ffcc"), p.w, 800);
  await play(pil, [{ transform: T(p.x, y, "scaleY(0)"), opacity: 1 }, { transform: T(p.x, y, "scaleY(1)"), opacity: 1, offset: .45 }, { transform: T(p.x, y, "scaleY(1.1)"), opacity: 0 }], { duration: 900 });
  remove(pil);
  if (thenBoom) await fxBoom(sqName, false);
}

async function fxBanner(text) {
  const b = boardPos();
  const n = fxNode(esc(text), "fx-banner", b.x, b.y);
  await play(n, [{ transform: T(b.x, b.y, "scale(.5)"), opacity: 0 }, { transform: T(b.x, b.y, "scale(1.05)"), opacity: 1, offset: .25 }, { transform: T(b.x, b.y, "scale(1)"), opacity: 1, offset: .8 }, { transform: T(b.x, b.y - 20, "scale(1)"), opacity: 0 }], { duration: 1100 });
  remove(n);
}

async function fxDiscard(col, card) {
  const hidden = !canSeeCard(col), p = handPos(col);
  const n = flyCard(card, hidden);
  // the card catches fire and crumbles away
  particles(12, p.x, p.y - 20, dot(rand(["#ff8a3d", "#ffcf5c", "#7a3b1d"])), 70, 800);
  await play(n, [
    { transform: T(p.x, p.y - 40, "scale(1) rotate(0)"), opacity: 1, filter: "brightness(1) sepia(0)" },
    { transform: T(p.x, p.y - 60, "scale(.95) rotate(-6deg)"), opacity: 1, filter: "brightness(1.6) sepia(1) saturate(3)", offset: .4 },
    { transform: T(p.x, p.y - 90, "scale(.6) rotate(12deg)"), opacity: 0, filter: "brightness(.3) sepia(1) blur(3px)" },
  ], { duration: 900 });
  remove(n);
}


// ---------- board events: mines, respawn spots, freezes, check, captures ----------
function pieceGlyph(col, type, size) {
  const d = disguiseOnViewer();
  const t = d && col === viewer() && type !== "king" ? d.type : type;
  return `<span class="piece ${col}" style="font-size:${size}px">${GLYPH[t] || ""}${VS}</span>`;
}
async function blink(p, color, times = 2) {
  const f = fxNode("", "fx-dot", p.x, p.y, `width:${p.w}px;height:${p.h}px;border-radius:4px;background:${color}`);
  await play(f, Array.from({ length: times * 2 + 1 }, (_, i) => ({ transform: T(p.x, p.y), opacity: i % 2 ? .9 : 0 })), { duration: 160 * times * 2, easing: "linear" });
  remove(f);
}

// a piece steps on a hidden mine: warning blink, a big blast, and the piece is thrown into the air
async function fxMineKill(col, type, sqName) {
  const p = sqPos(sqName);
  await blink(p, "rgba(255,40,40,.75)", 2);
  const flying = fxNode(pieceGlyph(col, type, p.w * .78), "", p.x, p.y);
  const dir = Math.random() < .5 ? -1 : 1;
  play(flying, [
    { transform: T(p.x, p.y, "rotate(0) scale(1)"), opacity: 1 },
    { transform: T(p.x + dir * p.w * 1.2, p.y - p.h * 2.6, `rotate(${dir * 260}deg) scale(1.1)`), opacity: 1, offset: .45 },
    { transform: T(p.x + dir * p.w * 2.2, p.y + p.h * 1.5, `rotate(${dir * 620}deg) scale(.5)`), opacity: 0 },
  ], { duration: 1200, easing: "cubic-bezier(.3,.6,.5,1)" }).then(remove);
  const ring = fxNode("", "fx-ring", p.x, p.y, `width:${p.w * 2}px;height:${p.w * 2}px;color:#ffd27a`);
  play(ring, [{ transform: T(p.x, p.y, "scale(.2)"), opacity: 1 }, { transform: T(p.x, p.y, "scale(2.2)"), opacity: 0 }], { duration: 600 }).then(remove);
  particles(10, p.x, p.y, () => fxNode("", "fx-smoke", 0, 0, "background:radial-gradient(circle, rgba(90,80,80,.8), rgba(40,40,40,0) 70%);width:40px;height:40px"), p.w * 1.4, 1400);
  await fxBoom(sqName, true);
  // a scorch mark that fades away
  const scorch = fxNode("", "fx-dot", p.x, p.y, `width:${p.w * .8}px;height:${p.w * .8}px;background:radial-gradient(circle, rgba(30,20,15,.75), rgba(30,20,15,0) 70%)`);
  await play(scorch, [{ opacity: 1 }, { opacity: 1, offset: .5 }, { opacity: 0 }], { duration: 1400 });
  remove(scorch);
}

// a king walks onto a mine: it goes off, but a golden shield takes the blast
async function fxKingMine(col, sqName) {
  const p = sqPos(sqName);
  await blink(p, "rgba(255,40,40,.75)", 1);
  const shield = fxNode("", "fx-ring", p.x, p.y, `width:${p.w * 1.3}px;height:${p.w * 1.3}px;color:#f2c94c;background:radial-gradient(circle, rgba(242,201,76,.25), transparent 70%);box-shadow:0 0 20px #f2c94c`);
  play(shield, [
    { transform: T(p.x, p.y, "scale(.3)"), opacity: 0 },
    { transform: T(p.x, p.y, "scale(1)"), opacity: 1, offset: .25 },
    { transform: T(p.x, p.y, "scale(1.08)"), opacity: 1, offset: .7 },
    { transform: T(p.x, p.y, "scale(1.4)"), opacity: 0 },
  ], { duration: 1200 }).then(remove);
  await fxBoom(sqName, false);
}

// the owner's mine goes out of sight after their move: it sinks into the ground
async function fxMineHide(sqName) {
  const p = sqPos(sqName);
  const m = fxNode("✹", "", p.x, p.y, `font-size:${p.w / 1.5}px;color:#ff4d4d;text-shadow:0 0 3px #000`);
  particles(6, p.x, p.y, dot("#8a5a2b"), p.w * .6, 600);
  await play(m, [{ transform: T(p.x, p.y, "scale(1)"), opacity: .9 }, { transform: T(p.x, p.y + 6, "scale(.2) rotate(180deg)"), opacity: 0 }], { duration: 700, easing: "ease-in" });
  remove(m);
}

// a hidden respawn spot is found: a green portal swirls open and the piece's ghost rises
async function fxZone(col, type, sqName, found) {
  const p = sqPos(sqName), sz = p.w * 1.8;
  const color = found ? "69,217,138" : "150,150,160";
  const portal = fxNode("", "fx-ring", p.x, p.y, `width:${sz}px;height:${sz}px;border:none;background:repeating-conic-gradient(rgba(${color},.85) 0 15deg, rgba(${color},.1) 15deg 45deg);-webkit-mask:radial-gradient(circle, transparent 28%, #000 30%, #000 68%, transparent 70%);mask:radial-gradient(circle, transparent 28%, #000 30%, #000 68%, transparent 70%)`);
  const spin = play(portal, [
    { transform: T(p.x, p.y, "scale(0) rotate(0)"), opacity: 0 },
    { transform: T(p.x, p.y, "scale(1) rotate(360deg)"), opacity: 1, offset: .4 },
    { transform: T(p.x, p.y, "scale(1) rotate(720deg)"), opacity: 1, offset: .75 },
    { transform: T(p.x, p.y, "scale(0) rotate(1080deg)"), opacity: 0 },
  ], { duration: found ? 1500 : 1000, easing: "ease-in-out" });
  if (found) {
    const ghost = fxNode(pieceGlyph(col, type, p.w * .78), "", p.x, p.y, "filter:drop-shadow(0 0 10px #45d98a)");
    play(ghost, [{ transform: T(p.x, p.y, "scale(1)"), opacity: 0 }, { transform: T(p.x, p.y - p.h * .6, "scale(1.15)"), opacity: .7, offset: .5 }, { transform: T(p.x, p.y - p.h * 1.3, "scale(1.3)"), opacity: 0 }], { duration: 1300, delay: 300 }).then(remove);
    particles(14, p.x, p.y, dot("#a6ffcc"), p.w * 1.3, 1100);
  }
  await spin;
  remove(portal);
}

// Barricade freezing a piece: frost spreads over the square with ice crystals
async function fxFreeze(sqName) {
  const p = sqPos(sqName);
  const frost = fxNode("", "fx-dot", p.x, p.y, `width:${p.w}px;height:${p.h}px;border-radius:4px;background:radial-gradient(circle, rgba(220,240,255,.8), rgba(127,196,255,.35) 60%, transparent 75%)`);
  particles(12, p.x, p.y, star(["❄", "✦", "❅"], ["#dff1ff", "#7fc4ff"]), p.w * .9, 900);
  await play(frost, [{ transform: T(p.x, p.y, "scale(.2)"), opacity: 0 }, { transform: T(p.x, p.y, "scale(1)"), opacity: 1, offset: .4 }, { transform: T(p.x, p.y, "scale(1.05)"), opacity: 0 }], { duration: 1000 });
  remove(frost);
}

// a lock runs out: the bars break apart and fall away
async function fxUnlock(sqName) {
  const p = sqPos(sqName);
  const bars = [-0.3, 0, 0.3].map((f, i) => {
    const b = fxNode("", "fx-bar", 0, 0, `height:${p.h * .95}px;width:${p.w * .14}px`);
    const x = p.x + f * p.w, side = f === 0 ? (Math.random() < .5 ? -1 : 1) : Math.sign(f);
    return play(b, [
      { transform: T(x, p.y, "rotate(0)"), opacity: 1 },
      { transform: T(x + side * p.w * .5, p.y - p.h * .3, `rotate(${side * 40}deg)`), opacity: 1, offset: .3 },
      { transform: T(x + side * p.w * 1.1, p.y + p.h * 1.4, `rotate(${side * 140}deg)`), opacity: 0 },
    ], { duration: 800, delay: i * 60, easing: "cubic-bezier(.3,.5,.6,1)" }).then(remove);
  });
  particles(8, p.x, p.y, star(["✦"], ["#cfe6ff", "#fff"]), p.w * .8, 600);
  await Promise.all(bars);
}

// Abracadabra wears off
async function fxSpellEnds(col) {
  if (viewer() !== col) return boardFlash("rgba(176,114,242,.3)", 600);
  boardFlash("rgba(176,114,242,.5)", 900);
  boardClass("fx-magic", 900);
  const b = boardPos();
  particles(16, b.x, b.y, star(["✧", "✦"], ["#d9b3ff", "#fff"]), b.w * .5, 900);
  await fxBanner(tx("fxSpellEnds"));
}

// check: the king's square pulses red and the lost move type shatters
async function fxCheck(col, lost) {
  const k = S.board[col + "_king"];
  if (!k) return;
  const p = sqPos(toSquare(k));
  const ring = fxNode("", "fx-ring", p.x, p.y, `width:${p.w}px;height:${p.w}px;color:#ff4d4d;box-shadow:0 0 18px #ff4d4d`);
  play(ring, [{ transform: T(p.x, p.y, "scale(.6)"), opacity: 1 }, { transform: T(p.x, p.y, "scale(1.8)"), opacity: 0 }], { duration: 700, iterations: 2 }).then(remove);
  if (!lost) return sleep(700);
  const tag = fxNode(`− ${esc(typName(lost))}`, "fx-banner", p.x, p.y - p.h * .8, "font-size:18px;padding:6px 12px;color:#ff7a6b;box-shadow:0 0 0 2px rgba(229,72,77,.7)");
  await play(tag, [
    { transform: T(p.x, p.y - p.h * .5, "scale(.5)"), opacity: 0 },
    { transform: T(p.x, p.y - p.h * .9, "scale(1.1)"), opacity: 1, offset: .3 },
    { transform: T(p.x, p.y - p.h * .9, "scale(1)"), opacity: 1, offset: .75 },
    { transform: T(p.x, p.y - p.h * .9, "scale(1.3)"), opacity: 0, filter: "blur(6px)" },
  ], { duration: 1300 });
  remove(tag);
  particles(10, p.x, p.y - p.h * .9, dot("#ff7a6b"), p.w, 600);
}

// a capture: an impact flash where the piece was taken
async function fxCapture(col, tookType, sqName) {
  const p = sqPos(sqName), opp = other(col);
  const slash = fxNode("", "fx-dot", p.x, p.y, `width:${p.w * 1.2}px;height:6px;border-radius:3px;background:linear-gradient(90deg, transparent, #fff, transparent);box-shadow:0 0 12px #fff`);
  play(slash, [{ transform: T(p.x, p.y, "rotate(-35deg) scaleX(0)"), opacity: 1 }, { transform: T(p.x, p.y, "rotate(-35deg) scaleX(1)"), opacity: 1, offset: .5 }, { transform: T(p.x, p.y, "rotate(-35deg) scaleX(1.2)"), opacity: 0 }], { duration: 350 }).then(remove);
  const ghost = fxNode(pieceGlyph(opp, tookType, p.w * .7), "", p.x, p.y);
  particles(8, p.x, p.y, dot(opp === "w" ? "#fbfbfb" : "#2a2a30"), p.w * .8, 500);
  await play(ghost, [{ transform: T(p.x, p.y, "scale(1)"), opacity: .9 }, { transform: T(p.x, p.y - 10, "scale(.3) rotate(90deg)"), opacity: 0 }], { duration: 450 });
  remove(ghost);
}

// pawn reaches the end: golden burst and the bonus type floats up
async function fxPromo(col, type, sqName) {
  if (!sqName) return;
  const p = sqPos(sqName);
  const rays = fxNode("", "fx-ring", p.x, p.y, `width:${p.w * 2.2}px;height:${p.w * 2.2}px;border:none;background:repeating-conic-gradient(rgba(242,201,76,.7) 0 10deg, transparent 10deg 30deg)`);
  play(rays, [{ transform: T(p.x, p.y, "scale(0) rotate(0)"), opacity: 1 }, { transform: T(p.x, p.y, "scale(1.3) rotate(120deg)"), opacity: 0 }], { duration: 900 }).then(remove);
  particles(14, p.x, p.y, star(["★", "✦"], ["#f2c94c", "#fff3b0"]), p.w * 1.4, 900);
  const tag = fxNode(`+1 ${esc(typName(type))}`, "fx-banner", p.x, p.y, "font-size:18px;padding:6px 12px");
  await play(tag, [{ transform: T(p.x, p.y, "scale(.5)"), opacity: 0 }, { transform: T(p.x, p.y - p.h, "scale(1)"), opacity: 1, offset: .4 }, { transform: T(p.x, p.y - p.h * 1.6, "scale(1)"), opacity: 0 }], { duration: 1300 });
  remove(tag);
}

// game over: confetti for a win, grey dust for a draw
async function fxOver(kind) {
  const W = innerWidth, colors = kind === "stale" ? ["#8b90a0", "#5c6170"] : ["#f2c94c", "#3fbf6a", "#e5484d", "#4d93ee", "#b072f2", "#fff"];
  const all = [];
  for (let i = 0; i < 70; i++) {
    const x = rnd(0, W), c = rand(colors);
    const n = fxNode("", "fx-dot", x, -20, `width:${rnd(6, 11)}px;height:${rnd(10, 16)}px;border-radius:2px;background:${c}`);
    all.push(play(n, [{ transform: T(x, -20, "rotate(0)"), opacity: 1 }, { transform: T(x + rnd(-120, 120), innerHeight + 40, `rotate(${rnd(360, 1080)}deg)`), opacity: .8 }], { duration: rnd(1800, 3200), delay: rnd(0, 600), easing: "cubic-bezier(.3,.2,.6,1)" }).then(remove));
  }
  await Promise.all(all);
}

// things that change without a log line: a lock running out, a spell wearing off, your mine going out of sight
let fxSnap = null;
function takeSnap() {
  const v = viewer();
  return {
    v,
    locks: new Map(S.locks.map(l => [key(...l.sq), toSquare(l.sq)])),
    dis: { w: !!S.disguise.w, b: !!S.disguise.b },
    mines: new Map(isPlayer(v) ? S.mines.filter(m => m.by === v && m.at === S.ply).map(m => [key(...m.sq), toSquare(m.sq)]) : []),
  };
}
function diffFx(a, b) {
  const out = [];
  for (const [k, sq] of a.locks) if (!b.locks.has(k)) out.push(() => fxUnlock(sq));
  for (const c of ["w", "b"]) if (a.dis[c] && !b.dis[c]) out.push(() => fxSpellEnds(c));
  if (a.v === b.v) {
    const still = new Set(S.mines.map(m => key(...m.sq)));
    for (const [k, sq] of a.mines) if (!b.mines.has(k) && still.has(k)) out.push(() => fxMineHide(sq));
  }
  return out;
}

function fxFor(e) {
  const a = e.a;
  switch (e.k) {
    case "got": return () => fxGot(a[0], { t: a[1], l: a[2] }, a[3]);
    case "bought": return () => fxGot(a[0], { t: a[1], l: a[2] }, "bought");
    case "discarded": return () => fxDiscard(a[0], { t: a[1], l: a[2] });
    case "useBarricade": return () => fxBarricade(a[0], a[1], a[2]).then(() => a[3] ? fxFreeze(a[2]) : null);
    case "useAbra": return () => fxAbra(a[0], a[1]);
    case "useMine": return () => fxMine(a[0], a[1]);
    case "useReborn": return () => fxReborn(a[0]);
    case "useNomad": return () => fxNomad(a[0], a[1]);
    case "mineKill": return () => fxMineKill(a[0], a[1], a[2]);
    case "kingMine": return () => fxKingMine(a[0], a[1]);
    case "zoneFound": return a[2] ? () => fxZone(a[0], a[1], a[2], true) : null;
    case "zoneLost": return a[1] ? () => fxZone(a[0], "", a[1], false) : null;
    case "move": return a[5] ? () => fxCapture(a[0], a[5], a[3]) : null;
    case "checkLost": return () => fxCheck(a[0], a[1]);
    case "checkBare": return () => fxCheck(a[0], null);
    case "promo": return () => fxPromo(a[0], a[1], a[2]);
    case "over": return () => fxOver(a[0]);
    case "copyPlaced": return () => fxCopy(a[2], false);
    case "copyMine": return () => fxCopy(a[2], true);
    case "timedDraw": return () => fxBanner(tx("fxDraw"));
  }
  return null;
}

// called after every new state; `quiet` marks entries as seen without animating (joining, restarts)
function runFx(quiet) {
  if (!S || !S.log) return;
  const last = S.log.length ? (S.log[S.log.length - 1].n || 0) : 0;
  if (last < fxSeen) fxSeen = 0;          // a new game started
  const fresh = S.log.filter(e => (e.n || 0) > fxSeen);
  fxSeen = Math.max(fxSeen, last);
  const snap = takeSnap(), before = fxSnap;
  fxSnap = snap;
  if (quiet || reduceMotion) return;
  const queue = fresh.map(fxFor).filter(Boolean);
  if (before) queue.push(...diffFx(before, snap));
  for (const f of queue) fxChain = fxChain.then(f).catch(err => console.error(err));
}

// ---------- setup ----------
document.getElementById("board").addEventListener("click", e => {
  const sq = e.target.closest(".sq");
  if (sq) clickSquare(+sq.dataset.r, +sq.dataset.c);
});
document.getElementById("cardsCard").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.use !== undefined) onUseCard(+b.dataset.use);
  else if (b.dataset.buy !== undefined) onBuy(+b.dataset.buy);
  else if (b.id === "endPostBtn") onEndPost();
});
document.getElementById("myHand").addEventListener("click", e => {
  const c = e.target.closest("[data-card]");
  if (!c) return;
  const i = +c.dataset.card;
  if (targeting) targeting = null;
  selCard = selCard === i ? null : i;
  render();
});
document.getElementById("cardInfo").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "useCard" && selCard !== null) { const i = selCard; selCard = null; onUseCard(i); }
  else if (b.id === "closeCard") { selCard = null; render(); }
  else if (b.id === "cancelTarget") { targeting = null; render(); }
  else if (b.id === "endPostBtn") onEndPost();
});
document.getElementById("shopPanel").addEventListener("click", e => {
  const b = e.target.closest("button[data-buy]");
  if (b) onBuy(+b.dataset.buy);
});
document.getElementById("discardList").addEventListener("click", e => {
  const b = e.target.closest("[data-discard]");
  if (b) onDiscard(+b.dataset.discard);
});
document.getElementById("newGame").addEventListener("click", () => {
  if (mode === "online" && !restartArmed) {
    restartArmed = setTimeout(() => { restartArmed = null; render(); }, 3000);
    return render();
  }
  clearTimeout(restartArmed); restartArmed = null;
  restart();
});
document.getElementById("overNew").addEventListener("click", () => { if (mode === "online" && myRole === "spectator") return; restart(); });
document.getElementById("overClose").addEventListener("click", () => { overDismissed = true; render(); });
document.getElementById("promoGrid").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) onPromotion(b.dataset.type);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && targeting) { targeting = null; render(); } });
window.addEventListener("hashchange", readHash);

applyStatic();
S = G.freshState();
render();
runFx(true);
readHash();
