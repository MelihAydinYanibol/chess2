<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15171c;
    --panel: #1e2129;
    --panel-2: #262a34;
    --text: #e8e9ec;
    --muted: #8b90a0;
    --light: #e9dcc3;
    --dark: #a9825e;
    --green: #3fbf6a;
    --red: #e5484d;
    --gold: #f2c94c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 16px;
  }
  .app {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    max-width: 1440px;
  }
  .board-col {
    --size: min(88vw, 560px);
    --cw: clamp(58px, calc((var(--size) - 36px) / 7), 80px);
    display: flex; flex-direction: column; gap: 10px; align-items: stretch;
  }
  .shop-panel { width: 250px; }
  @media (max-width: 1220px) {
    .shop-panel { order: 3; width: min(88vw, 340px); }
    .panel { order: 2; }
  }
  .board-wrap {
    display: grid;
    grid-template-columns: 20px auto;
    grid-template-rows: auto 20px;
  }
  .ranks, .files {
    display: grid;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }
  .ranks { grid-template-rows: repeat(8, 1fr); align-items: center; }
  .files { grid-column: 2; grid-template-columns: repeat(8, 1fr); text-align: center; padding-top: 4px; }
  .board {
    width: var(--size);
    height: var(--size);
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    user-select: none;
  }
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .sq.light { background: var(--light); }
  .sq.dark { background: var(--dark); }
  .sq.selected { background: #e6c45a; }
  .sq.check { background: radial-gradient(circle, #ff5c5c 0%, #d63a3a 45%, transparent 75%), var(--dark); }
  .sq.light.check { background: radial-gradient(circle, #ff5c5c 0%, #d63a3a 45%, transparent 75%), var(--light); }
  .piece {
    font-size: calc(var(--size) / 8 * 0.78);
    line-height: 1;
    position: relative;
    z-index: 2;
    transition: opacity .15s;
  }
  .piece.w { color: #fbfbfb; text-shadow: 0 0 2px #000, 0 0 1px #000, 0 2px 3px rgba(0,0,0,.35); }
  .piece.b { color: #1d1d22; text-shadow: 0 0 1px rgba(255,255,255,.35); }
  .piece.dead { opacity: .35; }
  .dot {
    position: absolute;
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: var(--green);
    opacity: .85;
    z-index: 1;
  }
  .ring {
    position: absolute;
    inset: 4%;
    border-radius: 50%;
    border: 5px solid var(--green);
    z-index: 3;
    pointer-events: none;
  }
  .panel {
    width: min(88vw, 340px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .turn {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
  }
  .swatch {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #555;
  }
  .swatch.w { background: #fbfbfb; }
  .swatch.b { background: #1d1d22; border-color: #888; }
  .roll {
    font-size: 26px;
    font-weight: 700;
    color: var(--gold);
    min-height: 34px;
    text-transform: capitalize;
  }
  .roll.rolling { color: var(--muted); }
  .msg { color: var(--muted); font-size: 14px; min-height: 20px; margin-top: 4px; line-height: 1.4; }
  .msg.warn { color: var(--red); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--panel-2);
    text-transform: capitalize;
  }
  .chip.lost { text-decoration: line-through; color: #5c6170; background: transparent; border: 1px dashed #3a3f4b; }
  .king-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
  .king-row:last-child { margin-bottom: 0; }
  .side { margin-bottom: 10px; }
  .side:last-child { margin-bottom: 0; }
  .captured {
    min-height: 30px;
    font-size: 26px;
    line-height: 1.1;
    letter-spacing: 1px;
  }
  .captured .piece { font-size: 26px; }
  .captured .none { font-size: 13px; color: #5c6170; }
  .log {
    max-height: 170px;
    overflow-y: auto;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-direction: column-reverse;
    gap: 4px;
  }
  .log div b { color: var(--text); font-weight: 600; }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #3a3f4b;
    border-radius: 8px;
    padding: 10px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #2f3440; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: none;
    align-items: center; justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay .box {
    background: var(--panel);
    padding: 28px 32px;
    border-radius: 14px;
    text-align: center;
    max-width: 320px;
  }
  .overlay h2 { margin: 0 0 6px; font-size: 26px; }
  .overlay p { color: var(--muted); margin: 0 0 18px; }
  .promo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
  .promo-grid button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; text-transform: capitalize; }
  .promo-grid .g { font-size: 34px; line-height: 1; color: #fbfbfb; text-shadow: 0 0 2px #000; }
  .rules { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .rules summary { cursor: pointer; color: var(--text); font-weight: 600; }
  .rules ul { padding-left: 18px; margin: 8px 0 0; }
  .online-row { display: flex; gap: 8px; margin-top: 10px; }
  .online-row input {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--text);
    border: 1px solid #3a3f4b; border-radius: 8px;
    padding: 8px 10px; font: inherit; font-size: 12px;
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 6px; color: var(--muted); }
  .status .led { width: 8px; height: 8px; border-radius: 50%; background: #5c6170; }
  .status .led.on { background: var(--green); }
  .status .led.wait { background: var(--gold); }
  .small { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 8px; }
  .row-btns { display: flex; gap: 8px; margin-top: 10px; }
  .row-btns button { flex: 1; }
  button.primary { background: var(--green); border-color: var(--green); color: #0d1a12; }
  button.primary:hover { background: #4fd27b; }
  .who { font-size: 15px; font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; text-transform: none; }

  /* ---------- playing cards ---------- */
  .hand-zone { margin-left: 20px; width: var(--size); }
  .hand-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px 2px; }
  .hand-label .swatch { width: 12px; height: 12px; border-width: 1px; }
  .hand-row { display: flex; gap: 6px; justify-content: center; min-height: calc(var(--cw) * 1.4 + 8px); padding: 4px 2px; overflow-x: auto; }
  .hand-row.opp { min-height: calc(var(--cw) * 1.1 + 8px); }
  .hand-empty { align-self: center; font-size: 12px; color: #5c6170; }
  .gcard {
    --c1: #555; --c2: #222; --ink: #fff;
    flex: 0 0 auto;
    width: var(--cw); height: calc(var(--cw) * 1.4);
    border-radius: 9px; position: relative; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.28), transparent 60%), linear-gradient(165deg, var(--c1), var(--c2));
    box-shadow: 0 6px 14px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.28);
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding: 7px 5px 6px;
    cursor: pointer; user-select: none;
    transition: transform .15s, box-shadow .15s, opacity .15s;
  }
  .gcard::before { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(255,255,255,.35); border-radius: 7px; pointer-events: none; }
  .gcard::after { /* shine */
    content: ""; position: absolute; top: -40%; left: -60%; width: 60%; height: 180%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent); transform: rotate(18deg); pointer-events: none;
  }
  .gcard:hover { transform: translateY(-5px); }
  .gcard.sel { box-shadow: 0 0 0 3px var(--gold), 0 10px 22px rgba(0,0,0,.55); }
  /* hands held like a fan: each card has its own tilt along an arc */
  .hand-row { align-items: flex-end; overflow: visible; padding: 30px 4px 26px; }
  /* your cards sit right under the board; a picked or hovered card simply rises over its edge */
  #myHand { padding-top: 0; margin-top: -8px; position: relative; z-index: 5; }
  .hand-row .gcard {
    transform-origin: 50% 115%;
    transform: translateY(var(--lift, 0px)) rotate(var(--rot, 0deg));
    margin-left: calc(var(--cw) * -.14);
    transition: transform .22s cubic-bezier(.3,.7,.3,1.2), width .22s, height .22s, filter .22s, box-shadow .22s;
  }
  .hand-row .gcard:first-child { margin-left: 0; }
  .hand-row .gcard:hover { transform: translateY(var(--lift, 0px)) rotate(var(--rot, 0deg)); }
  /* the opponent's cards: small, on one line with their label, right against the board */
  .opp-zone { display: flex; align-items: center; gap: 10px; margin-bottom: -6px; }
  .opp-zone .hand-label { margin: 0; flex-shrink: 0; }
  .hand-row.opp { --cw: 34px; flex: 1; justify-content: flex-end; min-height: 0; padding: 2px 6px 0; align-items: flex-start; }
  .hand-row.opp .gcard { transform-origin: 50% -15%; margin-left: -9px; box-shadow: 0 2px 5px rgba(0,0,0,.45), inset 0 0 0 1px rgba(242,201,76,.55); }
  .hand-row.opp .gcard .emblem { font-size: 14px; }
  .hand-row.opp .hand-empty { font-size: 11px; }
  /* your hand when it isn't your time to choose: smaller and muted */
  #myHand .gcard { filter: saturate(.55) brightness(.8); }
  /* your time to choose: a little bigger and vivid */
  #myHand.active { --cw: clamp(64px, calc((var(--size) - 36px) / 7 * 1.12), 90px); }
  #myHand.active .gcard { filter: saturate(1.35) brightness(1.08); }
  #myHand.active .gcard.off { filter: saturate(.6) brightness(.82); }
  /* the picked card (tapped on a phone, hovered with a mouse): green border, larger, nearly upright, Use button in the middle */
  #myHand .gcard.sel {
    transform: translateY(calc(var(--lift, 0px) - 34px)) rotate(calc(var(--rot, 0deg) * .25)) scale(1.24);
    box-shadow: 0 0 0 3px #3fbf6a, 0 0 24px rgba(63,191,106,.8), 0 14px 28px rgba(0,0,0,.55);
    filter: saturate(1.35) brightness(1.1);
    z-index: 6;
  }
  .card-use { display: none; }
  #myHand .gcard.sel .card-use { display: block; }
  @media (hover: hover) and (pointer: fine) {
    #myHand.active .gcard:not(.off):hover {
      transform: translateY(calc(var(--lift, 0px) - 34px)) rotate(calc(var(--rot, 0deg) * .25)) scale(1.24);
      box-shadow: 0 0 0 3px #3fbf6a, 0 0 24px rgba(63,191,106,.8), 0 14px 28px rgba(0,0,0,.55);
      filter: saturate(1.35) brightness(1.1);
      z-index: 6;
    }
    #myHand.active .gcard:not(.off):hover .card-use { display: block; }
  }
  .card-use {
    position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); z-index: 4;
    padding: calc(var(--cw) * .06) calc(var(--cw) * .14); font-size: calc(var(--cw) * .15); font-weight: 800;
    background: #3fbf6a; color: #0d1a12; border: 2px solid #c8ffd9; border-radius: 999px;
    box-shadow: 0 3px 10px rgba(0,0,0,.55), 0 0 14px rgba(63,191,106,.8);
    animation: usePop .22s cubic-bezier(.3,.7,.3,1.5);
  }
  .card-use:hover { background: #4fd27b; }
  @keyframes usePop { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } }
  .gcard.off { opacity: .55; }
  .gcard .cname { font-size: calc(var(--cw) * .105); overflow-wrap: anywhere; max-width: 100%; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; text-align: center; line-height: 1.08; min-height: 2.2em; display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 2px rgba(0,0,0,.45); z-index: 1; }
  .gcard .art { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; z-index: 1; }
  .gcard .art .disc { width: 74%; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(0,0,0,.25) 70%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.35); }
  .gcard .art svg { width: 70%; height: 70%; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .gcard .foot { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: calc(var(--cw) * .11); font-weight: 700; z-index: 1; padding: 0 2px; }
  .gcard .lv { background: rgba(0,0,0,.35); border-radius: 999px; padding: 1px 6px; letter-spacing: .05em; }
  .gcard .tag { opacity: .9; }
  .k-barricade.gcard { --c1: #4d93ee; --c2: #142f5c; }
  .k-abra.gcard { --c1: #b072f2; --c2: #35145f; }
  .k-mine.gcard { --c1: #f2694f; --c2: #5e140e; }
  .k-reborn.gcard { --c1: #45d98a; --c2: #0c4a2c; }
  .k-nomad.gcard { --c1: #f6d36b; --c2: #7a4a0a; --ink: #2a1a02; }
  .k-nomad.gcard .cname { text-shadow: 0 1px 1px rgba(255,255,255,.4); }
  .k-second.gcard { --c1: #3fd6c6; --c2: #0b4d47; }
  .k-double.gcard { --c1: #ffa94d; --c2: #7a3300; }
  .k-curse.gcard { --c1: #8a3f7a; --c2: #1d0a1b; }
  .k-shield.gcard { --c1: #b8cde4; --c2: #2a3d58; --ink: #fff; }
  .k-crown.gcard { --c1: #f0c25a; --c2: #7a1f1f; }
  .k-scope.gcard { --c1: #6d7cff; --c2: #1a1d5a; }
  .k-counter.gcard { --c1: #ff5577; --c2: #520016; }
  .k-thief.gcard { --c1: #5f7a5c; --c2: #101810; }
  .k-quake.gcard { --c1: #c48a52; --c2: #3a220e; }
  .k-teleport.gcard { --c1: #3fd0ff; --c2: #5a1a8a; }
  .k-swap.gcard { --c1: #a5e86a; --c2: #1d5a28; --ink: #fff; }
  .k-mycall.gcard { --c1: #ff7cc0; --c2: #5a1238; }
  .k-rewind.gcard { --c1: #d9a96f; --c2: #45290f; }
  .gcard.back {
    width: calc(var(--cw) * .78); height: calc(var(--cw) * 1.1); cursor: default; padding: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(242,201,76,.25) 0 22%, transparent 23%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 6px, transparent 6px 12px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.06) 0 6px, transparent 6px 12px),
      linear-gradient(160deg, #3a3150, #17141f);
    box-shadow: 0 4px 10px rgba(0,0,0,.45), inset 0 0 0 2px rgba(242,201,76,.55);
    justify-content: center;
  }
  .gcard.back:hover { transform: none; }
  .gcard.back .emblem { font-size: calc(var(--cw) * .42); color: var(--gold); text-shadow: 0 2px 4px rgba(0,0,0,.6); z-index: 1; }
  .card-info { margin-left: 20px; width: var(--size); background: var(--panel); border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; min-height: 48px; }
  .card-info .txt { flex: 1; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .card-info .txt b { color: var(--text); display: block; font-size: 14px; }
  .card-info .btns { display: flex; gap: 6px; flex-shrink: 0; }
  .card-info button { padding: 8px 12px; font-size: 13px; }
  .shop-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .shop-item { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 9px; padding: 6px 8px; --cw: 40px; }
  .shop-item .gcard { cursor: default; padding: 3px 2px; }
  .shop-item .gcard:hover { transform: none; }
  .shop-item .gcard .cname, .shop-item .gcard .foot { display: none; }
  .shop-item .gcard .art .disc { width: 86%; }
  .shop-item .nm { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.25; }
  .shop-item button { padding: 6px 9px; font-size: 12px; white-space: nowrap; }
  .shop-points { font-size: 22px; font-weight: 700; color: var(--gold); }
  .shop-grid { --cw: 62px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 4px; justify-items: center; margin-top: 12px; }
  .shop-grid .gcard { transition: transform .2s cubic-bezier(.3,.7,.3,1.2), box-shadow .2s, filter .2s; }
  .shop-grid .gcard:hover { transform: none; }
  .shop-grid .gcard.off { filter: saturate(.5) brightness(.75); opacity: 1; }
  .shop-grid.open .gcard.buyable { filter: saturate(1.3) brightness(1.06); }
  .shop-grid .gcard .cname { letter-spacing: 0; font-size: calc(var(--cw) * .1); overflow-wrap: normal; }
  .shop-cell { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .price-tag { padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); font-size: 11px; font-weight: 800; white-space: nowrap; }
  .price-tag.ok { background: var(--gold); color: #2a1a02; }
  .shop-grid .gcard.sel { transform: scale(1.3); z-index: 6; box-shadow: 0 0 0 3px #3fbf6a, 0 0 22px rgba(63,191,106,.8), 0 12px 24px rgba(0,0,0,.55); }
  .shop-grid .gcard.sel .card-use { display: block; }
  @media (hover: hover) and (pointer: fine) {
    .shop-grid .gcard.buyable:hover { transform: scale(1.3); z-index: 6; box-shadow: 0 0 0 3px #3fbf6a, 0 0 22px rgba(63,191,106,.8), 0 12px 24px rgba(0,0,0,.55); }
    .shop-grid .gcard.buyable:hover .card-use { display: block; }
  }
  .shop-info { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 14px; min-height: 52px; }
  .shop-info b { display: block; color: var(--text); font-size: 13px; margin-bottom: 2px; }
  .discard-list .gcard { --cw: 76px; }
  .discard-list { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px; }
  /* ---------- layout additions ---------- */
  .left-col { width: 250px; display: flex; flex-direction: column; gap: 12px; }
  .left-col .shop-panel { width: auto; }
  @media (max-width: 1220px) { .left-col { order: 3; width: min(88vw, 340px); } }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; }
  .toolbar .tool { padding: 7px 10px; font-size: 13px; }
  .menu-btns { display: flex; flex-direction: column; gap: 8px; }
  .menu-btns button { text-align: left; }
  .vs-line { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .timers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .timers:empty { display: none; }
  .timer { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; background: var(--panel-2); border-radius: 8px; padding: 5px 9px; }
  .timer .swatch { width: 12px; height: 12px; border-width: 1px; }
  .timer.active { outline: 2px solid var(--gold); }
  .timer.low { color: var(--red); animation: pulseLow 1s infinite; }
  .timer.sd { color: var(--gold); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  @keyframes pulseLow { 50% { opacity: .55; } }
  .resign-btn { margin-top: 10px; width: 100%; padding: 7px; font-size: 13px; color: #ff9a9a; }

<script>
const G = window.Game;
const { TYPES, PROMO_TYPES, FILES, key, other, toSquare, isKing, rand, samePos, realType, squares, optionsFor } = G;
const GLYPH = { king: "♚", queen: "♛", rook: "♜", bishop: "♝", knight: "♞", pawn: "♟" };
const VS = "︎"; // force text style so the pawn isn't drawn as an emoji
const LEVELED = new Set(["barricade", "abra", "nomad"]);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// ---------- language ----------
let lang = store.get("rc-lang", (navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en");
if (!LANGS[lang]) lang = "en";
const L = () => LANGS[lang];
const tx = (k, ...a) => { const v = L()[k]; return typeof v === "function" ? v(...a) : v === undefined ? k : v; };
const colName = c => L().colors[c] || c;
const typName = t => L().types[t] || t;
const cardName = (t, l) => (L().cards[t] || "?") + (LEVELED.has(t) ? L().lvl(l) : "");
// turn raw log/note arguments into words: "w" -> White, "rook" -> rook
const word = x => x === "w" || x === "b" ? colName(x) : TYPES.includes(x) ? typName(x) : x;

// ---------- state ----------
let S;
let mode = "local";          // "local" (two players here), "bot", "online" or "replay"
let botColor = "b";
let gameCode = null, myRole = null, seatNames = { w: "", b: "" }, gameStarted = true, replayId = null, invitedName = "";
let localCfg = G.normCfg((() => { try { return JSON.parse(store.get("rc-cfg", "{}")); } catch (e) { return {}; } })());
let rotateLocal = store.get("rc-rotate", "1") !== "0";
let rolling = false, flash = null, overDismissed = false, resignArmed = null;
let targeting = null;        // { idx } while picking a square for a card
let localRecord = null;      // record of a game played in this browser (for "Share replay")
let replay = null;           // { rec, i, timer } while watching a replay
let lastRollN = 0, botTimer = null;
// server connection
const serverOk = /^https?:$/.test(location.protocol);
let ws = null, connected = false, me = null, needName = false, lobby = { players: [], games: [] }, leaderRows = [], clockSkew = 0, pendingJoin = null;

function viewer() {
  if (mode === "online") return myRole;
  if (mode === "bot") return other(botColor);
  if (mode === "replay") return null;
  return S.turn;
}
function isPlayer(v) { return v === "w" || v === "b"; }
function myTurn() {
  if (!S || S.over) return false;
  if (mode === "local") return true;
  if (mode === "bot") return S.turn !== botColor;
  if (mode === "online") return myRole === S.turn && gameStarted;
  return false;
}
// Abracadabra on the viewer: their own pieces look like one type, and the log is hidden
function disguiseOnViewer() { const v = viewer(); return isPlayer(v) && S.disguise ? S.disguise[v] : null; }
function pieceName(p) {
  const d = disguiseOnViewer();
  return colName(p[0]) + " " + (d && p[0] === viewer() ? L().piece : typName(realType(p)));
}
function turnsLeft(until) { return Math.max(1, Math.ceil((until - S.ply) / 2)); }
function sideName(col) {
  if (mode === "online") return seatNames[col] || tx("waitingSeat");
  if (mode === "bot") return col === botColor ? tx("computer") : (me ? me.name : tx("you"));
  if (mode === "replay") return (replay && replay.rec.names && replay.rec.names[col]) || "";
  return "";
}

// ---------- actions ----------
// Every action goes through Game.applyAction: here for games in this browser, on the server for online games.
function doAction(act) {
  if (mode === "replay") return;
  if (mode === "online") { send({ type: "act", act }); return; }
  const res = G.applyAction(S, S.turn, act);
  if (!res.ok) { flashMsg(tx(res.err), true); return; }
  S.seq++;
  onNewState();
}

function clickSquare(r, c) {
  if (mode === "replay" || S.over) return;
  if (!myTurn()) {
    if (mode === "bot") flashMsg(tx("botThinking"));
    else if (mode === "online" && !gameStarted) flashMsg(tx("msgWaitOpp"), true);
    else flashMsg(myRole === "spectator" ? tx("msgWatch") : tx("msgWait", colName(S.turn)), true);
    return;
  }
  if (rolling) return;
  if (S.hands[S.turn].length > G.HAND_MAX) { flashMsg(tx("msgDiscard"), true); return; }
  if (targeting) {
    const card = S.hands[S.turn][targeting.idx];
    if (!card || !G.validTarget(S, card, [r, c], targeting.picks)) { flashMsg(tx("msgBadTarget"), true); return; }
    const idx = targeting.idx;
    if (G.cardTarget(card) === "twoPieces" && !targeting.picks.length) { targeting.picks.push([r, c]); render(); flashMsg(targetHint(card)); return; }
    const sq2 = targeting.picks.length ? [r, c] : undefined, sq = targeting.picks.length ? targeting.picks[0] : [r, c];
    targeting = null;
    doAction({ kind: "card", idx, sq, sq2 });
    return;
  }
  if (S.choice) { flashMsg(tx("msgChoice"), true); return; }
  if (S.pendingCopy) {
    if (S.pendingCopy.squares.some(q => samePos(q, [r, c]))) doAction({ kind: "copy", sq: [r, c] });
    else flashMsg(tx("msgCopy", typName(S.pendingCopy.type)), true);
    return;
  }
  if (S.pendingPromo) { flashMsg(tx("msgPromo"), true); return; }
  if (S.postCard) { flashMsg(tx("msgPost"), true); return; }
  if (S.locked) {
    if (S.locked.moves.some(m => samePos(m, [r, c]))) doAction({ kind: "move", sq: [r, c] });
    else flashMsg(tx("msgMustMove", typName(S.locked.roll)), true);
    return;
  }
  const p = squares(S.board)[key(r, c)];
  if (!p) return;
  if (p[0] !== S.turn) { flashMsg(tx("msgWrongColor", colName(p[0]), colName(S.turn)), true); return; }
  if (G.isFrozen(S, p)) { flashMsg(tx("msgFrozen"), true); return; }
  if (S.deadRolls[p]) { flashMsg(tx("msgDead", typName(S.deadRolls[p])), true); return; }
  doAction({ kind: "roll", sq: [r, c] });
}

function targetHint(card) {
  const need = G.cardTarget(card), name = cardName(card.t, card.l);
  if (need === "piece") return tx("msgPickPiece", name);
  if (need === "twoPieces") return targeting && targeting.picks.length ? tx("msgPickSecond", name) : tx("msgPickPiece", name);
  return tx("msgTarget", name);
}
function onUseCard(idx) {
  if (!myTurn() || rolling) return;
  const card = S.hands[S.turn][idx];
  if (!card) return;
  if (!G.canPlay(S, card)) { flashMsg(tx("msgNoCardNow"), true); return; }
  const need = G.cardTarget(card);
  if (need === "type") return openTypePicker(idx, card);
  if (need) { targeting = { idx, picks: [] }; render(); flashMsg(targetHint(card)); return; }
  doAction({ kind: "card", idx });
}
// Crown Repair and My Call! ask for a move type
let typePickFor = null;
function openTypePicker(idx, card) {
  typePickFor = idx;
  const types = card.t === "crown" ? TYPES.filter(t => !S.kingOptions[S.turn].includes(t)) : TYPES;
  document.getElementById("typeTitle").textContent = cardName(card.t, card.l);
  document.getElementById("typeText").textContent = card.t === "crown" ? tx("pickTypeCrown") : tx("pickTypeMycall");
  document.getElementById("typeGrid").innerHTML = types.map(t => `<button data-type="${t}"><span class="g">${GLYPH[t]}${VS}</span>${esc(typName(t))}</button>`).join("");
  openModal("typeModal");
}
function pickType(type) {
  closeModal("typeModal");
  if (typePickFor === null) return;
  const idx = typePickFor;
  typePickFor = null;
  doAction({ kind: "card", idx, type });
}
function onBuy(i) {
  if (!myTurn() || rolling) return;
  if (!G.canBuy(S)) { flashMsg(tx("msgNoBuyNow"), true); return; }
  if (S.points[S.turn] < G.SHOP[i][2]) { flashMsg(tx("msgPoor"), true); return; }
  doAction({ kind: "buy", i });
}
function onDiscard(idx) { if (myTurn()) doAction({ kind: "discard", idx }); }
function onEndPost() { if (myTurn()) doAction({ kind: "endPost" }); }
function onPromotion(type) { if (myTurn()) doAction({ kind: "promo", type }); }
function onResign() {
  if (!resignArmed) { resignArmed = setTimeout(() => { resignArmed = null; render(); }, 3000); return render(); }
  clearTimeout(resignArmed); resignArmed = null;
  doAction({ kind: "resign" });
}

// Called after every change of S. `quiet`: a fresh or loaded game, so nothing is animated.
function onNewState(quiet) {
  selCard = null;
  selShop = null;
  if (!S.over) shareLink = "";
  flash = null;
  if (targeting && !(myTurn() && G.canUseCard(S))) targeting = null;
  const newRoll = !quiet && S.rollN > lastRollN && !!S.lastRoll;
  lastRollN = S.rollN || 0;
  if ((mode === "local" || mode === "bot") && localRecord && !quiet) G.recordStep(localRecord, S);
  if (newRoll) startRollAnim();
  render();
  runFx(quiet);
  scheduleBot();
}

// the roll panel spins through move types before showing the result
function startRollAnim() {
  rolling = true;
  const el = document.getElementById("roll");
  el.classList.add("rolling");
  let i = 0;
  const timer = setInterval(() => {
    el.textContent = typName(rand(TYPES));
    Sound.play("rollTick");
    if (++i >= 8) {
      clearInterval(timer);
      el.classList.remove("rolling");
      rolling = false;
      const dead = S.lastRoll && S.deadRolls[S.lastRoll.piece];
      Sound.play(dead ? "rollDead" : "rollDone");
      render();
    }
  }, 45);
}

// ---------- games in this browser (two players, or against the computer) ----------
function startLocal(kind, cfg) {
  if (mode === "online") send({ type: "leave" });
  leaveReplay(true);
  mode = kind;
  gameCode = null; myRole = null; replayId = null;
  localCfg = G.normCfg(cfg || localCfg);
  store.set("rc-cfg", JSON.stringify(localCfg));
  botColor = localCfg.randomSides ? (Math.random() < .5 ? "w" : "b") : "b";
  S = G.freshState(0, localCfg);
  localRecord = G.newRecord(S, { w: kind === "bot" ? sideName("w") : "", b: kind === "bot" ? sideName("b") : "" });
  overDismissed = false; targeting = null; flash = null; lastRollN = 0;
  clearHash();
  onNewState(true);
}
function scheduleBot() {
  if (mode !== "bot" || S.over || S.turn !== botColor || botTimer) return;
  botTimer = setTimeout(() => {
    botTimer = null;
    if (mode !== "bot" || S.over || S.turn !== botColor) return;
    if (rolling) return scheduleBot();
    const act = G.botStep(S);
    if (act) { S.seq++; onNewState(); }
    else setTimeout(scheduleBot, 1000);
  }, S.locked ? 700 : 850);
}
// timers for games in this browser; online the server keeps time
setInterval(() => {
  if (!S) return;
  if ((mode === "local" || mode === "bot") && G.tick(S, Date.now())) { S.seq++; onNewState(); return; }
  renderTimers();
}, 250);

function playAgain() {
  if (mode === "online") send({ type: "restart" });
  else if (mode === "replay") leaveReplay();
  else startLocal(mode, S.cfg);
}

// ---------- the server connection ----------
function randomId(n) {
  return Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
}
function secret() {
  let id = store.get("rc-player", "");
  if (!/^[a-z0-9]{16,40}$/.test(id)) { id = randomId(20); store.set("rc-player", id); }
  return id;
}
function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }
function connect() {
  if (!serverOk) return;
  const sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws = sock;
  sock.onopen = () => { connected = true; send({ type: "hello", secret: secret(), name: store.get("rc-name", "") }); render(); };
  sock.onmessage = e => { try { handleServer(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  sock.onclose = () => {
    if (ws !== sock) return;
    connected = false; me = null;
    render();
    setTimeout(connect, 2000);
  };
}

function handleServer(m) {
  switch (m.type) {
    case "needName":
      needName = true;
      // only interrupt when the player came to play online (an invite link); otherwise the online panel asks
      if (pendingJoin || m.taken) openNameModal(m.taken ? tx("nameTaken") : "");
      break;
    case "nameError": openNameModal(tx(m.key)); break;
    case "me":
      me = m.me; needName = false;
      store.set("rc-name", me.name);
      closeModal("nameModal");
      // rejoin the online game we were in, or the one in the address bar
      if (pendingJoin) { send({ type: "join", code: pendingJoin }); pendingJoin = null; }
      else if (mode === "online" && gameCode) send({ type: "join", code: gameCode });
      break;
    case "lobby": lobby = m; break;
    case "leaderboard": leaderRows = m.rows; renderLeaderboard(); break;
    case "state": {
      const first = mode !== "online" || gameCode !== m.code;
      if (first) { leaveReplay(true); mode = "online"; overDismissed = false; localRecord = null; }
      const wasOver = !!(S && S.over), oldSeq = S ? S.seq : -1, oldPly = S ? S.ply : -1;
      gameCode = m.code; myRole = m.role; seatNames = m.names; gameStarted = m.started; replayId = m.replayId; invitedName = m.invited || "";
      clockSkew = m.now - Date.now();
      S = m.state;
      if (location.hash !== "#play-" + m.code) location.hash = "play-" + m.code;
      if (!S.over || !wasOver) overDismissed = false;
      // a brand-new game (restart) or our first look at this one: don't replay its history
      onNewState(first || S.seq < oldSeq || (S.ply === 0 && oldPly > 0));
      return;
    }
    case "actError": flashMsg(tx(m.key), true); break;
    case "invite": showInvite(m); break;
    case "inviteDeclined": flashMsg(tx("inviteDeclined", m.name), true); break;
    case "error":
      if (m.fatal) { clearHash(); if (mode === "online") startLocal("local"); }
      flashMsg(tx(m.key), true);
      break;
  }
  render();
}

function createOnline(cfg, pub, invitePid) {
  localCfg = G.normCfg(cfg); store.set("rc-cfg", JSON.stringify(localCfg));
  send({ type: "create", cfg: localCfg, public: pub, invite: invitePid || undefined });
}
function joinOnline(code) {
  if (!connected || !me) { pendingJoin = code; return; }
  send({ type: "join", code });
}
function leaveOnline() {
  send({ type: "leave" });
  startLocal("local");
}
function clearHash() {
  if (!location.hash) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; }
}
function readHash() {
  const p = location.hash.match(/^#play-([a-z0-9]{6,16})$/);
  if (p && p[1] !== gameCode) joinOnline(p[1]);
  const r = location.hash.match(/^#replay-([a-z0-9]{10})$/);
  if (r && !(mode === "replay" && replay && replay.id === r[1])) loadReplay(r[1]);
}

// ---------- rendering ----------
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
function flashMsg(text, warn) { flash = { text, warn }; renderMsg(); }

function noteText(n) { return n ? tx(n.k, ...n.a.map(word)) : ""; }

function renderMsg() {
  const el = document.getElementById("msg");
  const mover = myTurn();
  let text, warn = false;
  if (flash) { text = flash.text; warn = flash.warn; }
  else if (mode === "replay") text = tx("replayHint");
  else if (S.over) { const [a, b] = overText(); text = `${a} ${b}`; }
  else if (mode === "online" && !gameStarted) text = invitedName ? tx("invitedWait", invitedName) : tx("msgWaitOpp");
  else if (rolling) text = "…";
  else if (!mover) {
    if (S.choice) text = tx("msgChoiceOpp", colName(S.turn));
    else if (S.pendingPromo) text = tx("msgPromoOpp", colName(S.turn));
    else if (S.pendingCopy) text = tx("msgCopyOpp", colName(S.turn));
    else if (S.postCard) text = tx("msgPostOpp", colName(S.turn));
    else {
      text = mode === "bot" ? tx("botThinking") : myRole === "spectator" ? tx("msgWatch") : tx("msgWaiting", colName(S.turn));
      if (S.note) { text = noteText(S.note) + " " + text; warn = true; }
    }
  }
  else if (S.hands[S.turn].length > G.HAND_MAX) { text = tx("msgDiscard"); warn = true; }
  else if (targeting) { const c = S.hands[S.turn][targeting.idx]; text = c ? targetHint(c) : ""; }
  else if (S.choice) text = tx("msgChoice");
  else if (S.pendingCopy) text = tx("msgCopy", typName(S.pendingCopy.type));
  else if (S.pendingPromo) text = tx("msgPromo");
  else if (S.postCard) text = tx("msgPost");
  else if (S.locked) text = tx("msgLocked", pieceName(S.locked.piece), toSquare(S.board[S.locked.piece]), typName(S.locked.roll));
  else if (S.lastRoll && S.deadRolls[S.lastRoll.piece] && S.board[S.lastRoll.piece]) { text = tx("msgCantMove", pieceName(S.lastRoll.piece), typName(S.lastRoll.roll)); warn = true; }
  else {
    const base = G.canUseCard(S) && S.hands[S.turn].length ? tx("msgClick") : tx("msgClickNoCard");
    if (S.note) { text = noteText(S.note) + " " + base; warn = true; } else text = base;
  }
  el.textContent = text;
  el.className = "msg" + (warn ? " warn" : "");
}

function overText() {
  const o = S.over;
  if (o.k === "raw") return [o.title, o.text];
  const f = L().over[o.k];
  return f ? f(colName(o.w)) : [tx("gameOver"), ""];
}

function logText(e) {
  const v = viewer(), a = e.a;
  const hide = (e.o && isPlayer(v) && e.o !== v) || a[1] === undefined;   // someone else's private card info
  const lg = L().log;
  switch (e.k) {
    case "got": return hide ? lg.gotHidden(colName(a[0])) : lg.got(colName(a[0]), cardName(a[1], a[2]), L().reasons[a[3]] || "");
    case "bought": return hide ? lg.boughtHidden(colName(a[0])) : lg.bought(colName(a[0]), cardName(a[1], a[2]), a[3]);
    case "discarded": return hide ? lg.discardedHidden(colName(a[0])) : lg.discarded(colName(a[0]), cardName(a[1], a[2]));
    case "useBarricade": return lg.useBarricade(colName(a[0]), cardName("barricade", a[1]), a[2], a[3] ? colName(a[3]) : "");
    case "useAbra": return lg.useAbra(colName(a[0]), cardName("abra", a[1]));
    case "useNomad": return lg.useNomad(colName(a[0]), cardName("nomad", a[1]));
    case "countered": return lg.countered(colName(a[0]), cardName(a[1], a[2]), colName(a[3]));
    case "useThief": return hide ? lg.useThiefHidden(colName(a[0])) : lg.useThief(colName(a[0]), cardName(a[1], a[2]));
    case "scopeFound": return hide ? "" : lg.scopeFound(colName(a[0]), a[1]);
    case "over": return lg.over(a[0], colName(a[1]));
  }
  return lg[e.k] ? lg[e.k](...a.map(word)) : e.k;
}

function glyphHtml(type, col, extra = "") {
  return `<span class="piece ${col} ${extra}">${GLYPH[type] || ""}${VS}</span>`;
}
// how a board piece looks to the viewer (Abracadabra changes the viewer's own pieces)
function boardGlyph(p, extra) {
  const d = disguiseOnViewer();
  let t = realType(p);
  if (d && p[0] === viewer()) {
    if (!isKing(p)) t = d.type;
    else if (d.type === "king") extra += " gold";
  }
  return glyphHtml(t, p[0], extra);
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = tx(el.dataset.t); });
  document.getElementById("rulesList").innerHTML = L().rules.map(r => `<li>${esc(r)}</li>`).join("");
  document.getElementById("promoGrid").innerHTML = PROMO_TYPES.map(t =>
    `<button data-type="${t}"><span class="g">${GLYPH[t]}${VS}</span>${esc(typName(t))}</button>`).join("");
}

function fmtTime(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
let lastTickSec = null;
function renderTimers() {
  const el = document.getElementById("timers");
  if (!el || !S || !S.cfg) return;
  if (mode === "replay" || (mode === "online" && !gameStarted)) { el.innerHTML = ""; return; }
  const t = G.timeLeft(S, Date.now() + (mode === "online" ? clockSkew : 0));
  let h = "";
  if (t.turn !== null) h += `<span class="timer ${t.turn < 10000 ? "low" : ""}">⏱ ${esc(tx("timerTurn"))} ${fmtTime(t.turn)}</span>`;
  if (t.clock) {
    h += `<span class="timer sd">⚡ ${esc(tx("suddenOn"))}</span>`;
    for (const c of ["w", "b"]) h += `<span class="timer ${S.turn === c && !S.over ? "active" : ""} ${t.clock[c] < 10000 ? "low" : ""}"><span class="swatch ${c}"></span>${fmtTime(t.clock[c])}</span>`;
  }
  el.innerHTML = h;
  // ticking in the last seconds of your own time
  if (myTurn() && !S.over) {
    const left = Math.min(t.turn === null ? Infinity : t.turn, t.clock ? t.clock[S.turn] : Infinity);
    const sec = Math.ceil(left / 1000);
    if (sec <= 5 && sec > 0 && sec !== lastTickSec) Sound.play("tick");
    lastTickSec = sec;
  }
}

function render() {
  if (!S) return;
  const v = viewer(), mover = myTurn(), dis = disguiseOnViewer();
  const flipped = mode === "online" ? myRole === "b" : mode === "bot" ? botColor === "w" : mode === "replay" ? false : rotateLocal && S.turn === "b";
  const occ = squares(S.board);
  const moveSet = new Set((S.locked && !targeting && !rolling ? S.locked.moves : []).map(m => key(...m)));
  const copySet = new Set((S.pendingCopy && mover ? S.pendingCopy.squares : []).map(m => key(...m)));
  const lockMap = new Map(S.locks.map(l => [key(...l.sq), l]));
  const seenBy = x => isPlayer(v) && x.seen && x.seen.includes(v);
  const mineSet = new Set(S.mines.filter(m => mode === "replay" || (m.by === v && m.at === S.ply && isPlayer(v)) || seenBy(m)).map(m => key(...m.sq)));
  const zoneSet = new Set(S.zones.filter(z => mode === "replay" || seenBy(z)).map(z => key(...z.sq)));
  const shieldSet = new Set((S.shields || []).map(x => x.piece));
  const targetCard = targeting ? S.hands[S.turn][targeting.idx] : null;
  const kingPos = S.board[S.turn + "_king"];
  const sel = S.locked ? S.board[S.locked.piece] : null;

  let html = "";
  for (let dr = 0; dr < 8; dr++) {
    for (let dc = 0; dc < 8; dc++) {
      const r = flipped ? 7 - dr : dr, c = flipped ? 7 - dc : dc, k = key(r, c);
      const p = occ[k];
      const cls = ["sq", (r + c) % 2 ? "dark" : "light"];
      if (sel && sel[0] === r && sel[1] === c) cls.push("selected");
      if (S.checked && kingPos && kingPos[0] === r && kingPos[1] === c) cls.push("check");
      const lock = lockMap.get(k);
      if (lock) cls.push("locked");
      if (targetCard && G.validTarget(S, targetCard, [r, c], targeting.picks)) cls.push("target");
      if (targeting && targeting.picks.some(q => q[0] === r && q[1] === c)) cls.push("selected");
      if (p && shieldSet.has(p)) cls.push("shielded");
      let inner = "";
      if (p) inner += boardGlyph(p, (S.deadRolls && S.deadRolls[p] ? "dead" : "") + (lock && !isKing(p) ? " frozen" : ""));
      if (lock) inner += `<span class="lock-n">${turnsLeft(lock.until)}</span>`;
      if (mineSet.has(k)) inner += '<span class="mine-mark">✹</span>';
      if (zoneSet.has(k)) inner += '<span class="zone-mark"></span>';
      if (moveSet.has(k)) inner += p ? '<span class="ring"></span>' : '<span class="dot"></span>';
      if (copySet.has(k)) inner += '<span class="dot gold"></span>';
      html += `<div class="${cls.join(" ")}" data-r="${r}" data-c="${c}">${inner}</div>`;
    }
  }
  document.getElementById("board").innerHTML = html;
  const ranks = [8,7,6,5,4,3,2,1], files = [...FILES];
  if (flipped) { ranks.reverse(); files.reverse(); }
  document.getElementById("ranks").innerHTML = ranks.map(n => `<div>${n}</div>`).join("");
  document.getElementById("files").innerHTML = files.map(f => `<div>${f}</div>`).join("");

  // turn
  document.getElementById("turnSwatch").className = "swatch " + S.turn;
  let turnText = S.over ? tx("gameOver") : tx("toMove", colName(S.turn));
  if (!S.over && mover && mode !== "local") turnText = tx("yourTurn", colName(S.turn));
  document.getElementById("turnText").textContent = turnText;
  const vs = document.getElementById("vsLine");
  vs.textContent = mode === "local" ? "" : tx("vsLine", sideName("w"), sideName("b"));
  renderMsg();
  renderTimers();
  const rb = document.getElementById("resignBtn");
  const canResign = !S.over && ((mode === "online" && isPlayer(myRole) && gameStarted) || mode === "bot");
  rb.style.display = canResign ? "" : "none";
  rb.textContent = resignArmed ? tx("resignConfirm") : tx("resign");

  // roll
  if (!rolling) {
    const rollEl = document.getElementById("roll"), sub = document.getElementById("rollSub");
    if (S.locked) { rollEl.textContent = typName(S.locked.roll); sub.textContent = `${pieceName(S.locked.piece)} · ${toSquare(S.board[S.locked.piece])}`; }
    else if (S.lastRoll && S.board[S.lastRoll.piece]) { rollEl.textContent = typName(S.lastRoll.roll); sub.textContent = `${pieceName(S.lastRoll.piece)} ✗`; }
    else { rollEl.textContent = "—"; sub.textContent = ""; }
  }

  for (const col of ["w", "b"]) {
    const C = col.toUpperCase();
    document.getElementById("king" + C).innerHTML = TYPES.map(t =>
      `<span class="chip ${S.kingOptions[col].includes(t) ? "" : "lost"}">${esc(typName(t))}</span>`).join("");
    document.getElementById("cap" + C + "Label").textContent = tx("capturedBy", colName(col));
    const caps = S.captured[col];
    document.getElementById("cap" + C).innerHTML = dis
      ? `<span class="none">${esc(tx("hiddenAbra"))}</span>`
      : caps.length ? caps.map(p => glyphHtml(realType(p), p[0])).join("") : `<span class="none">${esc(tx("nothingYet"))}</span>`;
    const list = S.rollLists[col];
    document.getElementById("odds" + C).innerHTML = TYPES.map(t => {
      const n = list.filter(x => x === t).length;
      return `<span class="chip">${esc(typName(t))}${n > 1 ? " ×" + n : ""} · ${Math.round(n / list.length * 100)}%</span>`;
    }).join("");
  }

  const logEl = document.getElementById("log");
  logEl.textContent = "";
  const lines = dis ? [tx("hiddenAbra")] : S.log.length ? S.log.map(logText) : [tx("noMoves")];
  for (const line of lines.filter(Boolean).slice(-60)) { const d = document.createElement("div"); d.textContent = line; logEl.appendChild(d); }

  renderOver();

  // discard (more than 7 cards) comes before everything else for the mover
  const mustDiscard = mover && S.hands[S.turn].length > G.HAND_MAX;
  document.getElementById("discard").classList.toggle("show", mustDiscard);
  if (mustDiscard) {
    document.getElementById("discardList").innerHTML = S.hands[S.turn].map((c, i) => cardFace(c, "", `data-discard="${i}"`)).join("");
  }
  document.getElementById("promo").classList.toggle("show", !!(S.pendingPromo && mover && !mustDiscard));
  const showChoice = !!(S.choice && mover && !rolling);
  document.getElementById("choiceModal").classList.toggle("show", showChoice);
  if (showChoice) document.getElementById("choiceGrid").innerHTML = S.choice.rolls.map((t, i) =>
    `<button data-pick="${i}"><span class="g">${GLYPH[t]}${VS}</span>${esc(typName(t))}<span class="n">${esc(tx("choiceMoves", S.choice.moves[i]))}</span></button>`).join("");

  document.body.classList.toggle("no-cards", !S.cfg.cards);
  renderCards();
  renderHands();
  renderShop();
  renderMenu();
  renderOnline();
  renderReplayBar();
}

function renderOver() {
  const ov = document.getElementById("overlay");
  if (!(S.over && !overDismissed && mode !== "replay")) { ov.classList.remove("show"); return; }
  const [a, b] = overText();
  const linkBox = document.getElementById("overLink");
  if (!shareLink) linkBox.style.display = "none";
  document.getElementById("overTitle").textContent = a;
  document.getElementById("overText").textContent = b;
  const canAgain = mode !== "online" || isPlayer(myRole);
  document.getElementById("overNew").style.display = canAgain ? "" : "none";
  const rbtn = document.getElementById("overReplay");
  if (mode === "online") {
    rbtn.style.display = replayId ? "" : "none";
    rbtn.textContent = tx("copyReplay");
  } else {
    rbtn.style.display = serverOk && localRecord ? "" : "none";
    rbtn.textContent = tx("shareReplay");
  }
  ov.classList.add("show");
}

function renderCards() {
  const v = viewer();
  const el = document.getElementById("cardsCard");
  if (!S.cfg.cards) { el.innerHTML = `<div class="label">${esc(tx("cardsTitle"))}</div><div class="small" style="margin:0">${esc(tx("setCards"))}: ${esc(tx("off"))}</div>`; return; }
  let h = `<div class="label">${esc(tx("cardsTitle"))}</div><div class="stats">`;
  for (const col of ["w", "b"]) {
    const won = S.nomadWon[col], d = S.dist[col];
    const dist = won >= 2 ? tx("allWanderers", d) : tx("nextWanderer", d, G.NOMAD_AT[won], won === 0 ? "I" : "II");
    h += `<span class="swatch ${col}"></span><div><b>${esc(tx("points", S.points[col]))}</b> · ${esc(tx("oppHand", colName(col), S.hands[col].length))}
      <div class="muted">${esc(dist)} · ${esc(tx("pointsCap", S.earned[col]))}</div></div>`;
  }
  h += `</div>`;
  if (S.cfg.drawEvery) { const every = S.cfg.drawEvery * 2; h += `<div class="small">${esc(tx("nextDraw", every - (S.ply % every)))}</div>`; }

  // active effects
  const fx = S.locks.map(l => tx("lockEffect", toSquare(l.sq), turnsLeft(l.until)));
  for (const col of ["w", "b"]) {
    const d = S.disguise[col];
    if (d) fx.push(col === v ? tx("abraOnYou", turnsLeft(d.until)) : tx("abraOn", colName(col), turnsLeft(d.until)));
  }
  if (isPlayer(v)) for (const m of S.mines) if (m.by === v && m.at === S.ply) fx.push(tx("yourMine", toSquare(m.sq)));
  for (const x of S.shields || []) if (S.board[x.piece]) fx.push(tx("shieldOn", `${pieceName(x.piece)} ${toSquare(S.board[x.piece])}`, turnsLeft(x.until)));
  for (const cu of S.curses || []) fx.push(tx("curseOn", colName(cu.col), turnsLeft(cu.until)));
  if (S.forced) fx.push(tx("forcedOn", colName(S.forced.col), typName(S.forced.type)));
  if (isPlayer(v)) { const n = S.mines.filter(m => m.seen && m.seen.includes(v)).length + S.zones.filter(z => z.seen && z.seen.includes(v)).length; if (n) fx.push(tx("seenMines", n)); }
  h += `<div class="label" style="margin-top:12px">${esc(tx("effects"))}</div><div class="effects">${fx.length ? fx.map(x => `<div>${esc(x)}</div>`).join("") : `<div class="small" style="margin:0">${esc(tx("noEffects"))}</div>`}</div>`;
  el.innerHTML = h;
}

function cardFace(c, extra = "", attrs = "", inner = "") {
  const lv = LEVELED.has(c.t) ? ["I", "II", "III", "IV"][c.l - 1] : "★";
  return `<div class="gcard k-${c.t} ${extra}" ${attrs} title="${esc(cardName(c.t, c.l))}">
    <div class="cname">${esc(L().cards[c.t])}</div>
    <div class="art"><div class="disc"><svg viewBox="0 0 64 64">${ART[c.t]}</svg></div></div>
    <div class="foot"><span class="lv">${lv}</span><span class="tag">${esc(L().cardTag[c.t](c.l))}</span></div>${inner}
  </div>`;
}
function cardBack(attrs = "") { return `<div class="gcard back" ${attrs} title="${esc(tx("cardBack"))}"><span class="emblem">♞${VS}</span></div>`; }
// tilt and height of card i of n, so a hand looks like a fan held in someone's fingers
function fanStyle(i, n, flip) {
  const spread = Math.min(9, 44 / Math.max(1, n - 1)), off = i - (n - 1) / 2;
  const rot = off * spread, lift = off * off * spread * .32;
  return `style="--rot:${(flip ? -rot * .6 : rot).toFixed(1)}deg;--lift:${(flip ? -lift * .25 : lift).toFixed(1)}px"`;
}

let selCard = null;   // index of the card picked in the viewer's hand

// your cards under the board, the other side's cards (face down) above it
function renderHands() {
  const v = viewer(), mover = myTurn();
  const bottom = isPlayer(v) ? v : (mode === "local" ? S.turn : "w");
  const top = other(bottom);
  const showFaces = isPlayer(v) || mode === "replay";
  const topHand = S.hands[top], botHand = S.hands[bottom];
  const who = c => sideName(c) ? `${colName(c)} (${sideName(c)})` : colName(c);
  document.getElementById("oppLabel").innerHTML = `<span class="swatch ${top}"></span>${esc(tx("handLabel", who(top), topHand.length))}`;
  document.getElementById("myLabel").innerHTML = `<span class="swatch ${bottom}"></span>${esc(tx("handLabel", who(bottom), botHand.length))}`;
  document.getElementById("oppHand").innerHTML = !topHand.length ? `<span class="hand-empty">${esc(tx("noCards"))}</span>`
    : topHand.map((c, i) => mode === "replay" && c ? cardFace(c, "off", fanStyle(i, topHand.length, true)) : cardBack(fanStyle(i, topHand.length, true))).join("");
  if (selCard !== null && !botHand[selCard]) selCard = null;
  const playable = c => mover && !rolling && bottom === S.turn && G.canPlay(S, c);
  const myHandEl = document.getElementById("myHand");
  // "your time to choose": it's your turn and at least one card can be played
  myHandEl.classList.toggle("active", showFaces && botHand.some(c => c && playable(c)));
  myHandEl.innerHTML = !botHand.length ? `<span class="hand-empty">${esc(tx("noCards"))}</span>`
    : showFaces ? botHand.map((c, i) => {
        const sel = selCard === i || (targeting && targeting.idx === i);
        const btn = !targeting && playable(c) ? `<button class="card-use" data-use="${i}">${esc(tx("use"))}</button>` : "";
        return cardFace(c, (sel ? "sel" : "") + (c && playable(c) ? "" : " off"), `data-card="${i}" ${fanStyle(i, botHand.length)}`, btn);
      }).join("")
    : botHand.map((c, i) => cardBack(fanStyle(i, botHand.length))).join("");

  // info strip: what the picked card does, Use / Cancel, End turn after a capture
  const info = document.getElementById("cardInfo");
  let txt = "", btns = "";
  const picked = showFaces && selCard !== null ? botHand[selCard] : null;
  const usable = picked && playable(picked);
  if (targeting) {
    const c = S.hands[S.turn][targeting.idx];
    txt = `<b>${esc(c ? cardName(c.t, c.l) : "")}</b>${esc(c ? targetHint(c) : "")}`;
    btns = `<button id="cancelTarget">${esc(tx("cancel"))}</button>`;
  } else if (picked) {
    txt = `<b>${esc(cardName(picked.t, picked.l))}</b>${esc(L().cardDesc[picked.t](picked.l))}`;
    btns = `<button id="closeCard">${esc(tx("close"))}</button>`;
    if (mover && !usable) txt += `<br><span style="color:var(--red)">${esc(tx("msgNoCardNow"))}</span>`;
  } else if (showFaces && botHand.length) txt = esc(tx("pickCard"));
  else txt = esc(tx("noCards"));
  if (S.postCard && mover) btns += `<button class="primary" id="endPostBtn">${esc(tx("endTurn"))}</button>`;
  info.innerHTML = `<div class="txt">${txt}</div><div class="btns">${btns}</div>`;
}

// the shop shows just the cards with their price; hover (or tap on a phone) shows what one does and a Buy button
let selShop = null;
function renderShop() {
  const v = viewer(), el = document.getElementById("shopPanel");
  let h = `<div class="label">${esc(tx("shopTitle"))}</div>`;
  if (!isPlayer(v)) { el.innerHTML = h + `<div class="small">${esc(tx("watchingShop"))}</div>`; return; }
  const canShop = myTurn() && G.canBuy(S) && !rolling && v === S.turn;
  h += `<div class="shop-points">${esc(tx("shopPoints", S.points[v]))}</div>
    <div class="small" style="margin-top:2px">${esc(tx("pointsCap", S.earned[v]))}</div>
    <div class="shop-grid ${canShop ? "open" : ""}">`;
  G.SHOP.forEach(([t, l, price], i) => {
    const ok = canShop && S.points[v] >= price;
    const inner = ok ? `<button class="card-use" data-buy="${i}">${esc(tx("buy"))}</button>` : "";
    h += `<div class="shop-cell">${cardFace({ t, l }, (ok ? "buyable" : "off") + (selShop === i ? " sel" : ""), `data-shop="${i}"`, inner)}
      <span class="price-tag ${ok ? "ok" : ""}">${esc(tx("buyFor", price))}</span></div>`;
  });
  h += `</div><div class="shop-info" id="shopInfo">${shopInfoText(selShop)}</div>`;
  el.innerHTML = h;
}
function shopInfoText(i) {
  if (i === null || !G.SHOP[i]) return esc(tx("shopHint")) + " " + esc(tx("notForSale"));
  const [t, l, price] = G.SHOP[i];
  return `<b>${esc(cardName(t, l))} · ${esc(tx("buyFor", price))}</b>${esc(L().cardDesc[t](l))}`;
}

// ---------- online: you, the game you're in, players, open games ----------
function renderOnline() {
  const el = document.getElementById("onlineCard");
  if (!serverOk) { el.style.display = "none"; return; }
  el.style.display = "";
  if (connected && !me && needName) {
    el.innerHTML = `<div class="label">${esc(tx("onlineGame"))}</div><div class="small" style="margin:0 0 10px">${esc(tx("nameText"))}</div>
      <div class="row-btns" style="margin:0"><button id="nameBtn" class="primary">${esc(tx("nameTitle"))}</button></div>`;
    return;
  }
  if (!connected || !me) {
    el.innerHTML = `<div class="label">${esc(tx("onlineGame"))}</div><div class="status"><span class="led wait"></span><span>${esc(connected ? tx("joining") : tx("connecting"))}</span></div>`;
    return;
  }
  let h = `<div class="label">${esc(tx("yourName"))}</div>
    <div class="me-row"><div><div class="who">${esc(me.name)}</div><div class="small" style="margin:0">${esc(tx("record", me.points, me.w, me.d, me.l))}</div></div>
    <button id="nameBtn" class="small-btn">${esc(tx("change"))}</button></div>`;

  if (mode === "online" && gameCode) {
    const link = `${location.origin}${location.pathname}#play-${gameCode}`;
    const you = isPlayer(myRole) ? tx("youPlay", colName(myRole)) : tx("youWatch");
    h += `<div class="label" style="margin-top:14px">${esc(tx("onlineGame"))}</div>
      <div class="who">${esc(you)}</div>
      <div class="online-row"><input id="linkBox" readonly value="${esc(link)}"><button id="copyBtn">${esc(tx("copyLink"))}</button></div>
      <div class="small">${esc(isPlayer(myRole) && !gameStarted ? tx("sendLink") : tx("watchLink"))}</div>
      <div class="row-btns"><button id="leaveBtn">${esc(tx("leave"))}</button></div>`;
  }

  // other players online, with an invite button
  const others = lobby.players.filter(p => p.pid !== me.pid);

  // open games in the lobby

  const open = lobby.games.filter(g => g.code !== gameCode);

  }
  h += `</div><div class="row-btns"><button id="lbBtn">🏆 ${esc(tx("leaderboard"))}</button></div>`;
  el.innerHTML = h;
}

let shareLink = "";

async function shareReplay(btn) {
  if (mode === "online") { const link = `${location.origin}${location.pathname}#replay-${replayId}`; showLink(link); return copyText(link, btn, tx("replayCopied")); }
  if (!localRecord) return;
  btn.disabled = true; btn.textContent = tx("replaySaving");
  try {
    G.recordStep(localRecord, S);
    const res = await fetch("api/replays", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(localRecord) });
    const { id } = await res.json();
    if (!id) throw new Error("no id");
    btn.disabled = false;
    const link = `${location.origin}${location.pathname}#replay-${id}`;
    showLink(link);
    btn.textContent = tx("replayTitle");
    copyText(link, btn, tx("replayCopied"));
  } catch (e) { btn.disabled = false; btn.textContent = tx("replayFailed"); }
}
function copyText(text, btn, done) {
  const ok = () => { btn.textContent = done; setTimeout(() => render(), 1800); };
  // if the browser blocks the clipboard, the link stays visible in its text box to copy by hand
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, () => {});
}
async function loadReplay(id) {
  flashMsg(tx("replayLoading"));
  try {
    const res = await fetch("api/replay/" + id);
    if (!res.ok) throw new Error("missing");
    const rec = await res.json();
    if (mode === "online") send({ type: "leave" });
    mode = "replay"; gameCode = null; myRole = null; localRecord = null;
    replay = { id, rec, i: 0, timer: null };
    showFrame(0, true);
  } catch (e) { flashMsg(tx("replayNotFound"), true); }
}
function frameState(rec, i) {
  const f = rec.frames[i];
  return { ...G.freshState(0, rec.cfg), ...f, log: rec.log.slice(0, f.L), deadRolls: {}, locked: null, lastRoll: null, note: null,
    pendingPromo: null, postCard: false, moved: false, cfg: G.normCfg(rec.cfg) };
}
function showFrame(i, quiet) {
  const n = replay.rec.frames.length;
  replay.i = Math.max(0, Math.min(n - 1, i));
  const before = replay.i;
  S = frameState(replay.rec, replay.i);
  onNewState(quiet);
  return before;
}
function stepReplay(d) {
  if (!replay) return;
  const next = replay.i + d;
  showFrame(next, d !== 1);
}
function toggleReplayPlay() {
  if (!replay) return;
  if (replay.timer) { clearInterval(replay.timer); replay.timer = null; }
  else {
    if (replay.i >= replay.rec.frames.length - 1) showFrame(0, true);
    replay.timer = setInterval(() => {
      if (!replay || replay.i >= replay.rec.frames.length - 1) { if (replay) { clearInterval(replay.timer); replay.timer = null; } render(); return; }
      stepReplay(1);
    }, 1300);
  }
  render();
}
function leaveReplay(silent) {
  if (!replay) return;
  if (replay.timer) clearInterval(replay.timer);
  replay = null;
  if (!silent) { clearHash(); startLocal("local"); }
}
function renderReplayBar() {

}

// ---------- animations ----------
// Every log entry has a running number (n). After each new state, entries we haven't animated yet are
// played in order, on this device and on the opponent's. Animations never block the game.
const FXL = document.getElementById("fx");
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let fxSeen = 0, fxChain = Promise.resolve();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const T = (x, y, extra = "") => `translate(-50%, -50%) translate(${x}px, ${y}px) ${extra}`;
const rnd = (a, b) => a + Math.random() * (b - a);

function fxNode(html, cls, x, y, style = "") {
  const d = document.createElement("div");
  d.className = "fx " + cls;
  d.style.cssText = style;
  d.innerHTML = html;
  d.style.transform = T(x, y);
  FXL.appendChild(d);
  return d;
}
function play(node, frames, opts) {
  const a = node.animate(frames, { fill: "forwards", easing: "ease-out", ...opts });
  return a.finished.catch(() => {}).then(() => node);
}
const remove = n => n && n.remove();
function center(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; }
function sqPos(name) {
  const c = FILES.indexOf(name[0]), r = 8 - +name.slice(1);
  const el = document.querySelector(`.sq[data-r="${r}"][data-c="${c}"]`);
  return el ? center(el) : boardPos();
}
function boardPos() { return center(document.getElementById("board")); }
function bottomColor() { const v = viewer(); return isPlayer(v) ? v : (mode === "online" ? "w" : S.turn); }
function handPos(col) { return center(document.getElementById(col === bottomColor() ? "myHand" : "oppHand")); }
function shopPos() { return center(document.getElementById("shopPanel")); }
function canSeeCard(col) { const v = viewer(); return !isPlayer(v) || v === col; }
function flyCard(card, hidden) {
  const cls = "fx-card" + (hidden ? "" : " k-" + card.t);
  return fxNode(hidden ? cardBack() : cardFace(card), cls, 0, 0);
}
function particles(n, x, y, make, spread, ms) {
  const all = [];
  for (let i = 0; i < n; i++) {
    const ang = rnd(0, Math.PI * 2), dist = rnd(spread * .4, spread);
    const p = make(i);
    p.style.transform = T(x, y);
    all.push(play(p, [
      { transform: T(x, y, "scale(.4)"), opacity: 1 },
      { transform: T(x + Math.cos(ang) * dist, y + Math.sin(ang) * dist, `scale(${rnd(.6, 1.3)}) rotate(${rnd(-200, 200)}deg)`), opacity: 0 },
    ], { duration: ms * rnd(.7, 1.1), easing: "cubic-bezier(.2,.7,.3,1)" }).then(remove));
  }
  return Promise.all(all);
}
const dot = color => () => fxNode("", "fx-dot", 0, 0, `background:${color};box-shadow:0 0 8px ${color}`);
const star = (chars, colors) => () => fxNode(rand(chars), "fx-star", 0, 0, `color:${rand(colors)}`);
function boardFlash(color, ms = 700) {
  const b = document.getElementById("board").getBoundingClientRect();
  const w = fxNode("", "fx-wash", 0, 0, `left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px;background:radial-gradient(circle, ${color}, transparent 75%)`);
  w.style.transform = "none";
  return play(w, [{ opacity: 0 }, { opacity: 1, offset: .35 }, { opacity: 0 }], { duration: ms }).then(remove);
}
function boardClass(cls, ms) {
  const b = document.getElementById("board");
  b.classList.remove(cls); void b.offsetWidth; b.classList.add(cls);
  setTimeout(() => b.classList.remove(cls), ms);
}

  await play(n, entrance, { duration: 650, easing: "cubic-bezier(.2,.8,.3,1)" });
  await sleep(220);
  await play(n, [
    { transform: T(x, y, "scale(1)"), opacity: 1 },
    { transform: T(to.x, to.y, "scale(.7)"), opacity: .2 },
  ], { duration: 420, easing: "ease-in" });
  remove(n);
}

// card leaves its owner's hand and travels to (x, y)
async function cardTo(col, card, x, y, ms = 480, endScale = .9) {
  const from = handPos(col), n = flyCard(card, false);
  await play(n, [
    { transform: T(from.x, from.y, "scale(.8)"), opacity: .4 },
    { transform: T(x, y, `scale(${endScale})`), opacity: 1 },
  ], { duration: ms, easing: "cubic-bezier(.3,.7,.3,1)" });
  return n;
}

async function fxBarricade(col, l, sqName) {
  const p = sqPos(sqName), card = { t: "barricade", l };
  const n = await cardTo(col, card, p.x, p.y - 30);
  await play(n, [{ transform: T(p.x, p.y - 30, "scale(.9)"), opacity: 1 }, { transform: T(p.x, p.y, "scale(.2)"), opacity: 0 }], { duration: 220, easing: "ease-in" });
  remove(n);
  // iron bars slam down onto the square, then a lock snaps shut
  const bars = [-0.3, 0, 0.3].map((f, i) => {
    const b = fxNode("", "fx-bar", 0, 0, `height:${p.h * .95}px;width:${p.w * .14}px`);
    return play(b, [
      { transform: T(p.x + f * p.w, p.y - p.h * 2), opacity: 0 },
      { transform: T(p.x + f * p.w, p.y + 4), opacity: 1, offset: .75 },
      { transform: T(p.x + f * p.w, p.y), opacity: 1 },
    ], { duration: 360, delay: i * 90, easing: "cubic-bezier(.5,0,.7,1.4)" });
  });
  const done = await Promise.all(bars);
  boardClass("fx-shake", 300);
  const lock = fxNode(`<svg viewBox="0 0 64 64" width="${p.w * .7}" height="${p.w * .7}">${ART.barricade}</svg>`, "fx-lock", p.x, p.y);

    { transform: T(p.x, p.y, "scale(0)"), opacity: 0 },
    { transform: T(p.x, p.y, "scale(1.35)"), opacity: 1, offset: .5 },
    { transform: T(p.x, p.y, "scale(1)"), opacity: 1 },
  ], { duration: 380 });
  await sleep(350);
  await Promise.all([lock, ...done].map(x => play(x, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 })));
  [lock, ...done].forEach(remove);
}

async function fxAbra(col, l) {
  const b = boardPos(), card = { t: "abra", l };
  const n = await cardTo(col, card, b.x, b.y, 500, 1.1);
  // the card spins faster and faster, then bursts into stars and the pieces shimmer
  await play(n, [

}

async function fxMine(col, sqName) {
  const mine = viewer() === col && isPlayer(col) && sqName;
  if (mine) {
    // the owner sees the mine being buried in its square
    const p = sqPos(sqName);
    const n = await cardTo(col, { t: "mine", l: 1 }, p.x, p.y - 20);
    await play(n, [
      { transform: T(p.x, p.y - 20, "scale(.9) rotate(0)"), opacity: 1 },
      { transform: T(p.x, p.y, "scale(.25) rotate(540deg)"), opacity: .9, offset: .7 },
      { transform: T(p.x, p.y + 6, "scale(.05) rotate(720deg)"), opacity: 0 },
    ], { duration: 650, easing: "ease-in" });
    remove(n);
    const ring = fxNode("", "fx-ring", p.x, p.y, `width:${p.w * .9}px;height:${p.w * .9}px;color:#8a5a2b`);
    particles(8, p.x, p.y, dot("#8a5a2b"), p.w * .7, 500);
    await play(ring, [{ transform: T(p.x, p.y, "scale(.2)"), opacity: 1 }, { transform: T(p.x, p.y, "scale(1.4)"), opacity: 0 }], { duration: 500 });
    remove(ring);
  } else {
    // everyone else only sees it vanish into smoke: where it went stays secret
    const b = boardPos(), from = handPos(col);
    const n = flyCard({ t: "mine", l: 1 }, true);
    await play(n, [{ transform: T(from.x, from.y, "scale(.8)"), opacity: .4 }, { transform: T(b.x, b.y, "scale(1)"), opacity: 1 }], { duration: 450 });
    const q = fxNode("?", "fx-banner", b.x, b.y, "color:#ff7a6b;font-size:44px;padding:6px 20px");
    play(q, [{ transform: T(b.x, b.y, "scale(.4)"), opacity: 0 }, { transform: T(b.x, b.y, "scale(1)"), opacity: 1, offset: .4 }, { transform: T(b.x, b.y - 30, "scale(1.1)"), opacity: 0 }], { duration: 1000 }).then(remove);
    particles(14, b.x, b.y, () => fxNode("", "fx-smoke", 0, 0), 110, 1000);
    await play(n, [{ opacity: 1, filter: "blur(0)" }, { opacity: 0, filter: "blur(10px)" }], { duration: 600 });
    remove(n);
  }
}

async function fxReborn(col) {
  const b = boardPos(), card = { t: "reborn", l: 1 };
  const n = await cardTo(col, card, b.x, b.y, 480, 1);
  // the card fades into a green glow, and spirits rise from all over the board
  await play(n, [{ transform: T(b.x, b.y, "scale(1)"), opacity: 1, filter: "brightness(1)" }, { transform: T(b.x, b.y - 60, "scale(1.3)"), opacity: 0, filter: "brightness(3) blur(8px)" }], { duration: 600 });

  boardFlash("rgba(69,217,138,.45)", 1000);

}

  const b = boardPos(), card = { t: "nomad", l };

async function fxBoom(sqName, big) {
  const p = sqPos(sqName), size = p.w * (big ? 2.4 : 1.6);
  const b = fxNode("", "fx-boom", p.x, p.y, `width:${size}px;height:${size}px`);

async function fxCopy(sqName, thenBoom) {
  const p = sqPos(sqName);

// ---------- board events: mines, respawn spots, freezes, check, captures ----------
function pieceGlyph(col, type, size) {
  const d = disguiseOnViewer();
  const t = d && col === viewer() && type !== "king" ? d.type : type;
  return `<span class="piece ${col}" style="font-size:${size}px">${GLYPH[t] || ""}${VS}</span>`;
}
async function blink(p, color, times = 2) {
  const f = fxNode("", "fx-dot", p.x, p.y, `width:${p.w}px;height:${p.h}px;border-radius:4px;background:${color}`);
  await play(f, Array.from({ length: times * 2 + 1 }, (_, i) => ({ transform: T(p.x, p.y), opacity: i % 2 ? .9 : 0 })), { duration: 160 * times * 2, easing: "linear" });
  remove(f);
}

// a piece steps on a hidden mine: warning blink, a big blast, and the piece is thrown into the air
async function fxMineKill(col, type, sqName) {
  const p = sqPos(sqName);
  await blink(p, "rgba(255,40,40,.75)", 2);
  const flying = fxNode(pieceGlyph(col, type, p.w * .78), "", p.x, p.y);
  const dir = Math.random() < .5 ? -1 : 1;
  play(flying, [
    { transform: T(p.x, p.y, "rotate(0) scale(1)"), opacity: 1 },
    { transform: T(p.x + dir * p.w * 1.2, p.y - p.h * 2.6, `rotate(${dir * 260}deg) scale(1.1)`), opacity: 1, offset: .45 },
    { transform: T(p.x + dir * p.w * 2.2, p.y + p.h * 1.5, `rotate(${dir * 620}deg) scale(.5)`), opacity: 0 },
  ], { duration: 1200, easing: "cubic-bezier(.3,.6,.5,1)" }).then(remove);
  const ring = fxNode("", "fx-ring", p.x, p.y, `width:${p.w * 2}px;height:${p.w * 2}px;color:#ffd27a`);
  play(ring, [{ transform: T(p.x, p.y, "scale(.2)"), opacity: 1 }, { transform: T(p.x, p.y, "scale(2.2)"), opacity: 0 }], { duration: 600 }).then(remove);
  particles(10, p.x, p.y, () => fxNode("", "fx-smoke", 0, 0, "background:radial-gradient(circle, rgba(90,80,80,.8), rgba(40,40,40,0) 70%);width:40px;height:40px"), p.w * 1.4, 1400);
  await fxBoom(sqName, true);
  // a scorch mark that fades away
  const scorch = fxNode("", "fx-dot", p.x, p.y, `width:${p.w * .8}px;height:${p.w * .8}px;background:radial-gradient(circle, rgba(30,20,15,.75), rgba(30,20,15,0) 70%)`);
  await play(scorch, [{ opacity: 1 }, { opacity: 1, offset: .5 }, { opacity: 0 }], { duration: 1400 });
  remove(scorch);
}

async function fxKingMine(col, sqName) {

}

// a hidden respawn spot is found: a green portal swirls open and the piece's ghost rises
async function fxZone(col, type, sqName, found) {
  const p = sqPos(sqName), sz = p.w * 1.8;
  const color = found ? "69,217,138" : "150,150,160";
  const portal = fxNode("", "fx-ring", p.x, p.y, `width:${sz}px;height:${sz}px;border:none;background:repeating-conic-gradient(rgba(${color},.85) 0 15deg, rgba(${color},.1) 15deg 45deg);-webkit-mask:radial-gradient(circle, transparent 28%, #000 30%, #000 68%, transparent 70%);mask:radial-gradient(circle, transparent 28%, #000 30%, #000 68%, transparent 70%)`);
  const spin = play(portal, [
    { transform: T(p.x, p.y, "scale(0) rotate(0)"), opacity: 0 },
    { transform: T(p.x, p.y, "scale(1) rotate(360deg)"), opacity: 1, offset: .4 },
    { transform: T(p.x, p.y, "scale(1) rotate(720deg)"), opacity: 1, offset: .75 },
    { transform: T(p.x, p.y, "scale(0) rotate(1080deg)"), opacity: 0 },
  ], { duration: found ? 1500 : 1000, easing: "ease-in-out" });
  if (found) {
    const ghost = fxNode(pieceGlyph(col, type, p.w * .78), "", p.x, p.y, "filter:drop-shadow(0 0 10px #45d98a)");
    play(ghost, [{ transform: T(p.x, p.y, "scale(1)"), opacity: 0 }, { transform: T(p.x, p.y - p.h * .6, "scale(1.15)"), opacity: .7, offset: .5 }, { transform: T(p.x, p.y - p.h * 1.3, "scale(1.3)"), opacity: 0 }], { duration: 1300, delay: 300 }).then(remove);
    particles(14, p.x, p.y, dot("#a6ffcc"), p.w * 1.3, 1100);
  }
  await spin;
  remove(portal);
}

// Barricade freezing a piece: frost spreads over the square with ice crystals
async function fxFreeze(sqName) {
  Sound.play("freeze");
  const p = sqPos(sqName);
  const frost = fxNode("", "fx-dot", p.x, p.y, `width:${p.w}px;height:${p.h}px;border-radius:4px;background:radial-gradient(circle, rgba(220,240,255,.8), rgba(127,196,255,.35) 60%, transparent 75%)`);

// a lock runs out: the bars break apart and fall away
async function fxUnlock(sqName) {
  Sound.play("unlock");
  const p = sqPos(sqName);
  const bars = [-0.3, 0, 0.3].map((f, i) => {

// things that change without a log line: a lock running out, a spell wearing off, your mine going out of sight
let fxSnap = null;
function takeSnap() {
  const v = viewer();
  return {
    v,
    locks: new Map(S.locks.map(l => [key(...l.sq), toSquare(l.sq)])),
    dis: { w: !!S.disguise.w, b: !!S.disguise.b },
    mines: new Map(isPlayer(v) ? S.mines.filter(m => m.by === v && m.at === S.ply).map(m => [key(...m.sq), toSquare(m.sq)]) : []),
  };
}
function diffFx(a, b, fresh) {
  const out = [];
  for (const [k, sq] of a.locks) if (!b.locks.has(k)) out.push(() => fxUnlock(sq));
  for (const c of ["w", "b"]) if (a.dis[c] && !b.dis[c]) out.push(() => fxSpellEnds(c));
  if (a.v === b.v) {
    // the mine left your view; unless it just exploded, it's now hidden
    const blown = new Set(fresh.filter(e => e.k === "mineKill" || e.k === "kingMine").map(e => e.k === "mineKill" ? e.a[2] : e.a[1]));
    for (const [k, sq] of a.mines) if (!b.mines.has(k) && !blown.has(sq)) out.push(() => fxMineHide(sq));
  }
  return out;
}

  [mh, hh].forEach(h => { h.style.transformOrigin = "50px 50px"; h.style.transformBox = "view-box"; });
  mh.animate([{ transform: "rotate(0)" }, { transform: "rotate(-1440deg)" }], { duration: 1600, easing: "ease-in-out" });
  hh.animate([{ transform: "rotate(0)" }, { transform: "rotate(-360deg)" }], { duration: 1600, easing: "ease-in-out" });
  document.getElementById("board").animate([{ filter: "none" }, { filter: "sepia(.8) brightness(.9)" }, { filter: "none" }], { duration: 1600 });
  await play(clock, [{ transform: T(b.x, b.y, "scale(.3) rotate(0)"), opacity: 0 }, { transform: T(b.x, b.y, "scale(1) rotate(-30deg)"), opacity: 1, offset: .2 }, { transform: T(b.x, b.y, "scale(1) rotate(-60deg)"), opacity: 1, offset: .8 }, { transform: T(b.x, b.y, "scale(1.3) rotate(-90deg)"), opacity: 0 }], { duration: 1700 });
  remove(clock);
}

function soundFor(e) {

  switch (e.k) {
    case "got": return [canSeeCard(a[0]) && a[1] ? "cardGet" : "cardHidden", 250];
    case "bought": return ["buy", 0];

    case "over": {

      return [!w ? "drawGame" : isPlayer(v) && mode !== "local" && w !== v ? "lose" : "win", 300];
    }
  }
  return null;
}
function fxFor(e) {
  const a = e.a;
  switch (e.k) {
    case "got": return () => fxGot(a[0], { t: a[1], l: a[2] }, a[3]);
    case "bought": return () => fxGot(a[0], { t: a[1], l: a[2] }, "bought");
    case "discarded": return () => fxDiscard(a[0], { t: a[1], l: a[2] });
    case "useBarricade": return () => fxBarricade(a[0], a[1], a[2]).then(() => a[3] ? fxFreeze(a[2]) : null);
    case "useAbra": return () => fxAbra(a[0], a[1]);
    case "useMine": return () => fxMine(a[0], a[1]);

    case "shieldMine": return () => fxShieldMine(a[2]);
    case "useCrown": return () => fxCrown(a[0], a[1]);
    case "useScope": return () => fxScope(a[0], a[1]);
    case "countered": return () => fxCountered(a[0], { t: a[1], l: a[2] }, a[3]);
    case "useThief": return () => fxThief(a[0]);
    case "useQuake": return () => fxQuake(a[0]);
    case "useTeleport": return () => fxTeleport(a[0], a[1], a[2], a[3]);
    case "useSwap": return () => fxSwap(a[0], a[1], a[2]);

    case "forcedRoll": return () => fxForced();
    case "useRewind": return () => fxRewind(a[0]);

    case "kingMine": return () => fxKingMine(a[0], a[1]);
    case "zoneFound": return a[2] ? () => fxZone(a[0], a[1], a[2], true) : null;
    case "zoneLost": return a[1] ? () => fxZone(a[0], "", a[1], false) : null;
    case "move": return a[5] ? () => fxCapture(a[0], a[5], a[3]) : null;
    case "checkLost": return () => fxCheck(a[0], a[1]);
    case "checkBare": return () => fxCheck(a[0], null);
    case "promo": return () => fxPromo(a[0], a[1], a[2]);

    case "timedDraw": return () => fxBanner(tx("fxDraw"));

  }
  return null;
}

// called after every new state; `quiet` marks entries as seen without animating (joining, restarts)
function runFx(quiet) {
  if (!S || !S.log) return;
  const last = S.log.length ? (S.log[S.log.length - 1].n || 0) : 0;
  if (last < fxSeen) fxSeen = 0;          // a new game started
  const fresh = S.log.filter(e => (e.n || 0) > fxSeen);
  fxSeen = Math.max(fxSeen, last);
  const snap = takeSnap(), before = fxSnap;
  fxSnap = snap;
  if (quiet || reduceMotion) return;
  const queue = fresh.map(e => {
    const f = fxFor(e), snd = soundFor(e);
    if (!f && !snd) return null;
    return () => { if (snd) setTimeout(() => Sound.play(snd[0]), snd[1]); return f ? f() : sleep(120); };
  }).filter(Boolean);
  if (before) queue.push(...diffFx(before, snap, fresh));
  for (const f of queue) fxChain = fxChain.then(f).catch(err => console.error(err));
}

  const card = S.hands[viewer()] && S.hands[viewer()][+c.dataset.card];

});
