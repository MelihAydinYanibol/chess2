<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15171c;
    --panel: #1e2129;
    --panel-2: #262a34;
    --text: #e8e9ec;
    --muted: #8b90a0;
    --light: #e9dcc3;
    --dark: #a9825e;
    --green: #3fbf6a;
    --red: #e5484d;
    --gold: #f2c94c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 16px;
  }
  .app {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    max-width: 1000px;
  }
  .board-wrap {
    display: grid;
    grid-template-columns: 20px auto;
    grid-template-rows: auto 20px;
  }
  .ranks, .files {
    display: grid;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }
  .ranks { grid-template-rows: repeat(8, 1fr); align-items: center; }
  .files { grid-column: 2; grid-template-columns: repeat(8, 1fr); text-align: center; padding-top: 4px; }
  .board {
    --size: min(88vw, 560px);
    width: var(--size);
    height: var(--size);
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    user-select: none;
  }
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .sq.light { background: var(--light); }
  .sq.dark { background: var(--dark); }
  .sq.selected { background: #e6c45a; }
  .sq.check { background: radial-gradient(circle, #ff5c5c 0%, #d63a3a 45%, transparent 75%), var(--dark); }
  .sq.light.check { background: radial-gradient(circle, #ff5c5c 0%, #d63a3a 45%, transparent 75%), var(--light); }
  .piece {
    font-size: calc(var(--size) / 8 * 0.78);
    line-height: 1;
    position: relative;
    z-index: 2;
    transition: opacity .15s;
  }
  .piece.w { color: #fbfbfb; text-shadow: 0 0 2px #000, 0 0 1px #000, 0 2px 3px rgba(0,0,0,.35); }
  .piece.b { color: #1d1d22; text-shadow: 0 0 1px rgba(255,255,255,.35); }
  .piece.dead { opacity: .35; }
  .dot {
    position: absolute;
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: var(--green);
    opacity: .85;
    z-index: 1;
  }
  .ring {
    position: absolute;
    inset: 4%;
    border-radius: 50%;
    border: 5px solid var(--green);
    z-index: 3;
    pointer-events: none;
  }
  .panel {
    width: min(88vw, 340px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .turn {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
  }
  .swatch {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #555;
  }
  .swatch.w { background: #fbfbfb; }
  .swatch.b { background: #1d1d22; border-color: #888; }
  .roll {
    font-size: 26px;
    font-weight: 700;
    color: var(--gold);
    min-height: 34px;
    text-transform: capitalize;
  }
  .roll.rolling { color: var(--muted); }
  .msg { color: var(--muted); font-size: 14px; min-height: 20px; margin-top: 4px; line-height: 1.4; }
  .msg.warn { color: var(--red); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--panel-2);
    text-transform: capitalize;
  }
  .chip.lost { text-decoration: line-through; color: #5c6170; background: transparent; border: 1px dashed #3a3f4b; }
  .king-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
  .king-row:last-child { margin-bottom: 0; }
  .side { margin-bottom: 10px; }
  .side:last-child { margin-bottom: 0; }
  .captured {
    min-height: 30px;
    font-size: 26px;
    line-height: 1.1;
    letter-spacing: 1px;
  }
  .captured .piece { font-size: 26px; }
  .captured .none { font-size: 13px; color: #5c6170; }
  .log {
    max-height: 170px;
    overflow-y: auto;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-direction: column-reverse;
    gap: 4px;
  }
  .log div b { color: var(--text); font-weight: 600; }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #3a3f4b;
    border-radius: 8px;
    padding: 10px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #2f3440; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: none;
    align-items: center; justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay .box {
    background: var(--panel);
    padding: 28px 32px;
    border-radius: 14px;
    text-align: center;
    max-width: 320px;
  }
  .overlay h2 { margin: 0 0 6px; font-size: 26px; }
  .overlay p { color: var(--muted); margin: 0 0 18px; }
  .promo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
  .promo-grid button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; text-transform: capitalize; }
  .promo-grid .g { font-size: 34px; line-height: 1; color: #fbfbfb; text-shadow: 0 0 2px #000; }
  .rules { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .rules summary { cursor: pointer; color: var(--text); font-weight: 600; }
  .rules ul { padding-left: 18px; margin: 8px 0 0; }
  .online-row { display: flex; gap: 8px; margin-top: 10px; }
  .online-row input {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--text);
    border: 1px solid #3a3f4b; border-radius: 8px;
    padding: 8px 10px; font: inherit; font-size: 12px;
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 6px; color: var(--muted); }
  .status .led { width: 8px; height: 8px; border-radius: 50%; background: #5c6170; }
  .status .led.on { background: var(--green); }
  .status .led.wait { background: var(--gold); }
  .small { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 8px; }
  .row-btns { display: flex; gap: 8px; margin-top: 10px; }
  .row-btns button { flex: 1; }
  button.primary { background: var(--green); border-color: var(--green); color: #0d1a12; }
  button.primary:hover { background: #4fd27b; }
  .who { font-size: 15px; font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; text-transform: none; }
  .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .lang-btn { padding: 6px 12px; font-size: 13px; }
  .sq.locked::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(45deg, rgba(40,120,220,.45) 0 6px, rgba(40,120,220,.12) 6px 12px);
    box-shadow: inset 0 0 0 3px #2878dc;
  }
  .lock-n { position: absolute; top: 2px; left: 4px; z-index: 4; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 0 2px #000; }
  .mine-mark { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; font-size: calc(var(--size) / 12); color: #ff4d4d; text-shadow: 0 0 3px #000; pointer-events: none; opacity: .9; }
  .dot.gold { background: var(--gold); width: 36%; height: 36%; }
  .sq.target { box-shadow: inset 0 0 0 3px rgba(242,201,76,.8); }
  .piece.gold { color: var(--gold) !important; }
  .piece.frozen { filter: drop-shadow(0 0 3px #7fc4ff); }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 13px; align-items: center; }
  .stats .muted { color: var(--muted); font-size: 12px; }
  .hand { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .card-item { background: var(--panel-2); border-radius: 8px; padding: 9px 10px; display: flex; gap: 10px; align-items: flex-start; }
  .card-item .body { flex: 1; min-width: 0; }
  .card-item .name { font-weight: 700; font-size: 14px; }
  .card-item .desc { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .card-item button { padding: 6px 10px; font-size: 12px; flex-shrink: 0; }
  .card-item.active { outline: 2px solid var(--gold); }
  .k-barricade .name { color: #6fb2ff; }
  .k-abra .name { color: #c58bff; }
  .k-mine .name { color: #ff7a6b; }
  .k-reborn .name { color: #6ee59a; }
  .k-nomad .name { color: var(--gold); }
  .shop-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
  .shop-row button { padding: 5px 10px; font-size: 12px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .effects { font-size: 13px; color: var(--text); display: flex; flex-direction: column; gap: 4px; }
  .discard-list { display: flex; flex-direction: column; gap: 6px; text-align: left; max-height: 60vh; overflow-y: auto; }
  .overlay .box.wide { max-width: 380px; }
  details.shop summary { cursor: pointer; font-weight: 600; font-size: 13px; margin-top: 12px; }
</style>
<script src="i18n.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div class="app">
  <div class="board-wrap">
    <div class="ranks" id="ranks"></div>
    <div class="board" id="board"></div>
    <div class="files" id="files"></div>
  </div>

  <div class="panel">
    <div class="card" id="onlineCard"></div>
    <div class="card">
      <div class="turn"><span class="swatch" id="turnSwatch"></span><span id="turnText"></span></div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card">
      <div class="label" data-t="roll"></div>
      <div class="roll" id="roll">—</div>
      <div class="sub" id="rollSub"></div>
    </div>

    <div class="card" id="cardsCard"></div>

    <div class="card">
      <div class="label" data-t="rollChances"></div>
      <div class="king-row"><span class="swatch w"></span><div class="chips" id="oddsW"></div></div>
      <div class="king-row" style="margin-bottom:14px"><span class="swatch b"></span><div class="chips" id="oddsB"></div></div>
      <div class="label" data-t="kingsMoveAs"></div>
      <div class="king-row"><span class="swatch w"></span><div class="chips" id="kingW"></div></div>
      <div class="king-row"><span class="swatch b"></span><div class="chips" id="kingB"></div></div>
    </div>

    <div class="card">
      <div class="side">
        <div class="label" id="capWLabel"></div>
        <div class="captured" id="capW"></div>
      </div>
      <div class="side">
        <div class="label" id="capBLabel"></div>
        <div class="captured" id="capB"></div>
      </div>
    </div>

    <div class="card">
      <div class="label" data-t="moves"></div>
      <div class="log" id="log"></div>
    </div>

    <div class="card rules">
      <details>
        <summary data-t="rulesTitle"></summary>
        <ul id="rulesList"></ul>
      </details>
    </div>

    <button id="newGame"></button>
  </div>
</div>

<div class="overlay" id="promo">
  <div class="box">
    <h2 data-t="pawnEndTitle"></h2>
    <p data-t="pawnEndText"></p>
    <div class="promo-grid" id="promoGrid"></div>
  </div>
</div>

<div class="overlay" id="discard">
  <div class="box wide">
    <h2 data-t="discardTitle"></h2>
    <p data-t="discardText"></p>
    <div class="discard-list" id="discardList"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="box">
    <h2 id="overTitle"></h2>
    <p id="overText"></p>
    <div class="row-btns"><button id="overClose" data-t="seeBoard"></button><button id="overNew" class="primary" data-t="playAgain"></button></div>
  </div>
</div>

<script>
const G = window.Game;
const { TYPES, PROMO_TYPES, FILES, key, other, toSquare, isKing, rand, samePos, realType, squares, optionsFor } = G;
const GLYPH = { king: "♚", queen: "♛", rook: "♜", bishop: "♝", knight: "♞", pawn: "♟" };
const VS = "︎"; // force text style so the pawn isn't drawn as an emoji
const LEVELED = new Set(["barricade", "abra", "nomad"]);

// ---------- language ----------
let lang = "en";
try { lang = localStorage.getItem("rc-lang") || ((navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en"); } catch (e) {}
if (!LANGS[lang]) lang = "en";
const L = () => LANGS[lang];
const tx = (k, ...a) => { const v = L()[k]; return typeof v === "function" ? v(...a) : v; };
const colName = c => L().colors[c] || c;
const typName = t => L().types[t] || t;
const cardName = (t, l) => L().cards[t] + (LEVELED.has(t) ? L().lvl(l) : "");
// turn raw log/note arguments into words: "w" -> White, "rook" -> rook
const word = x => x === "w" || x === "b" ? colName(x) : TYPES.includes(x) ? typName(x) : x;

// ---------- state ----------
let S;
let mode = "local";        // "local" (hot-seat) or "online"
let gameCode = null;
let myRole = null;         // "w", "b" or "spectator" when online
let rotateLocal = true;
try { rotateLocal = localStorage.getItem("rc-rotate") !== "0"; } catch (e) {}
let connected = false, opponentHere = false, onlineError = "";
let rolling = false, flash = null, overDismissed = false, restartArmed = null;
let targeting = null;      // { idx } while picking a square for a card

// who is looking at the screen (hot-seat: whoever is moving)
function viewer() { return mode === "online" ? myRole : S.turn; }
function isPlayer(v) { return v === "w" || v === "b"; }
function myTurn() { return !S.over && (mode === "local" || myRole === S.turn); }
// Abracadabra on the viewer: their own pieces look like one type, and the log is hidden
function disguiseOnViewer() { const v = viewer(); return isPlayer(v) ? S.disguise[v] : null; }
function pieceName(p) {
  const d = disguiseOnViewer();
  return colName(p[0]) + " " + (d && p[0] === viewer() ? L().piece : typName(realType(p)));
}
function turnsLeft(until) { return Math.max(1, Math.ceil((until - S.ply) / 2)); }

// ---------- actions (each changes S, then commit() shares it) ----------
function clickSquare(r, c) {
  if (S.over) return;
  if (mode === "online" && myRole !== S.turn) {
    flashMsg(myRole === "spectator" ? tx("msgWatch") : tx("msgWait", colName(S.turn)), true);
    return;
  }
  if (rolling) return;
  if (S.hands[S.turn].length > G.HAND_MAX) { flashMsg(tx("msgDiscard"), true); return; }
  if (targeting) {
    const card = S.hands[S.turn][targeting.idx];
    if (card && G.validTarget(S, card, [r, c])) { const i = targeting.idx; targeting = null; G.useCard(S, i, [r, c]); commit(); }
    else flashMsg(tx("msgBadTarget"), true);
    return;
  }
  if (S.pendingCopy) {
    if (G.placeCopy(S, [r, c])) commit();
    else flashMsg(tx("msgCopy", typName(S.pendingCopy.type)), true);
    return;
  }
  if (S.pendingPromo) { flashMsg(tx("msgPromo"), true); return; }
  if (S.postCard) { flashMsg(tx("msgPost"), true); return; }
  if (S.locked) {
    if (G.makeMove(S, r, c)) return commit();
    flashMsg(tx("msgMustMove", typName(S.locked.roll)), true);
    return;
  }
  const p = squares(S.board)[key(r, c)];
  if (!p) return;
  if (p[0] !== S.turn) { flashMsg(tx("msgWrongColor", colName(p[0]), colName(S.turn)), true); return; }
  if (G.isFrozen(S, p)) { flashMsg(tx("msgFrozen"), true); return; }
  if (S.deadRolls[p]) { flashMsg(tx("msgDead", typName(S.deadRolls[p])), true); return; }

  const roll = rand(optionsFor(p, S));
  const game = S;
  animateRoll(roll, () => {
    if (S !== game) return; // a restart, leave or new online game happened mid-roll
    const name = pieceName(p);
    const result = G.resolveRoll(S, p, roll);
    commit();
    if (result === "dead") flashMsg(tx("msgCantMove", name, typName(roll)), true);
  });
}

function onUseCard(idx) {
  if (!myTurn() || rolling) return;
  if (targeting && targeting.idx === idx) { targeting = null; return render(); }
  if (!G.canUseCard(S)) { flashMsg(tx("msgNoCardNow"), true); return; }
  const card = S.hands[S.turn][idx];
  if (!card) return;
  if (G.cardTarget(card)) { targeting = { idx }; render(); flashMsg(tx("msgTarget", cardName(card.t, card.l))); return; }
  if (G.useCard(S, idx)) commit();
}
function onBuy(i) {
  if (!myTurn() || rolling) return;
  if (!G.canBuy(S)) { flashMsg(tx("msgNoBuyNow"), true); return; }
  if (S.points[S.turn] < G.SHOP[i][2]) { flashMsg(tx("msgPoor"), true); return; }
  if (G.buy(S, i)) commit();
}
function onDiscard(idx) { if (myTurn() && G.discard(S, S.turn, idx)) commit(); }
function onEndPost() { if (myTurn() && G.endPostCard(S)) commit(); }
function onPromotion(type) { if (myTurn() && G.choosePromotion(S, type)) commit(); }

function animateRoll(final, done) {
  rolling = true;
  const el = document.getElementById("roll");
  el.classList.add("rolling");
  let i = 0;
  const timer = setInterval(() => {
    el.textContent = typName(rand(TYPES));
    if (++i >= 8) {
      clearInterval(timer);
      el.classList.remove("rolling");
      rolling = false;
      done();
    }
  }, 45);
}

function restart() {
  S = G.freshState((S ? S.seq : 0) + 1);
  overDismissed = false; flash = null; targeting = null;
  publish(true);
  render();
}

// ---------- syncing (WebSocket to your server) ----------
function commit() {
  S.seq++;
  flash = null;
  if (targeting && !G.canUseCard(S)) targeting = null;
  publish(false);
  render();
}
function publish(isRestart) {
  if (mode === "online" && myRole !== "spectator") send({ type: "state", state: S, restart: !!isRestart });
}

let ws = null;
function randomId(n) {
  return Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
}
function playerId() {
  try {
    let id = localStorage.getItem("rc-player");
    if (!id) { id = randomId(20); localStorage.setItem("rc-player", id); }
    return id;
  } catch (e) {
    return window._rcPlayer || (window._rcPlayer = randomId(20));
  }
}
function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

function openSocket(firstMessage) {
  if (ws) { ws.onclose = null; ws.close(); }
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  const sock = new WebSocket(url);
  ws = sock;
  sock.onopen = () => { connected = true; onlineError = ""; send(firstMessage()); render(); };
  sock.onmessage = e => { try { handleServer(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  sock.onclose = () => {
    if (ws !== sock) return;
    connected = false; opponentHere = false;
    render();
    setTimeout(() => {
      if (ws === sock && mode === "online" && gameCode) {
        openSocket(() => ({ type: "join", code: gameCode, playerId: playerId() }));
      }
    }, 2000);
  };
}

function handleServer(m) {
  if (m.type === "joined") {
    if (!G.valid(m.state)) return;
    gameCode = m.code;
    myRole = m.role;
    S = m.state;
    overDismissed = false; targeting = null;
    if (location.hash !== "#play-" + m.code) location.hash = "play-" + m.code;
  } else if (m.type === "state") {
    if (!G.valid(m.state) || rolling) return;
    if (m.state.seq <= S.seq && !m.force) return;
    const wasOver = !!S.over;
    S = m.state;
    if (!S.over || !wasOver) overDismissed = false;
    flash = null;
    if (targeting && !(myTurn() && G.canUseCard(S))) targeting = null;
  } else if (m.type === "peers") {
    opponentHere = myRole === "w" ? !!m.b : myRole === "b" ? !!m.w : !!(m.w && m.b);
  } else if (m.type === "error") {
    onlineError = String(m.message || "Something went wrong.");
    if (m.fatal) { mode = "online"; gameCode = null; }
  }
  render();
}

function createOnline() {
  mode = "online";
  myRole = null; gameCode = null; onlineError = ""; targeting = null;
  S = G.freshState(1);
  overDismissed = false;
  render();
  openSocket(() => ({ type: "create", playerId: playerId(), state: S }));
}
function connectOnline(code) {
  mode = "online";
  gameCode = code; myRole = null; onlineError = ""; targeting = null;
  S = G.freshState(0);
  render();
  openSocket(() => ({ type: "join", code, playerId: playerId() }));
}
function leaveOnline() {
  if (ws) { const s = ws; ws = null; s.onclose = null; s.close(); }
  gameCode = null; myRole = null; mode = "local"; targeting = null;
  connected = false; opponentHere = false; onlineError = "";
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; }
  S = G.freshState();
  overDismissed = false;
  render();
}
function readHash() {
  const m = location.hash.match(/^#play-([a-z0-9]{6,16})$/);
  if (m && m[1] !== gameCode) connectOnline(m[1]);
}

// ---------- rendering ----------
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
function flashMsg(text, warn) { flash = { text, warn }; renderMsg(); }

function noteText(n) { return n ? tx(n.k, ...n.a.map(word)) : ""; }

function renderMsg() {
  const el = document.getElementById("msg");
  const mover = myTurn();
  let text, warn = false;
  if (flash) { text = flash.text; warn = flash.warn; }
  else if (S.over) { const [a, b] = overText(); text = `${a} ${b}`; }
  else if (!mover) {
    if (S.pendingPromo) text = tx("msgPromoOpp", colName(S.turn));
    else if (S.pendingCopy) text = tx("msgCopyOpp", colName(S.turn));
    else if (S.postCard) text = tx("msgPostOpp", colName(S.turn));
    else {
      text = myRole === "spectator" ? tx("msgWatch") : tx("msgWaiting", colName(S.turn));
      if (S.note) { text = noteText(S.note) + " " + text; warn = true; }
    }
  }
  else if (S.hands[S.turn].length > G.HAND_MAX) { text = tx("msgDiscard"); warn = true; }
  else if (targeting) { const c = S.hands[S.turn][targeting.idx]; text = c ? tx("msgTarget", cardName(c.t, c.l)) : ""; }
  else if (S.pendingCopy) text = tx("msgCopy", typName(S.pendingCopy.type));
  else if (S.pendingPromo) text = tx("msgPromo");
  else if (S.postCard) text = tx("msgPost");
  else if (S.locked) text = tx("msgLocked", pieceName(S.locked.piece), toSquare(S.board[S.locked.piece]), typName(S.locked.roll));
  else {
    const base = G.canUseCard(S) && S.hands[S.turn].length ? tx("msgClick") : tx("msgClickNoCard");
    if (S.note) { text = noteText(S.note) + " " + base; warn = true; } else text = base;
  }
  el.textContent = text;
  el.className = "msg" + (warn ? " warn" : "");
}

function overText() {
  const o = S.over;
  if (o.k === "raw") return [o.title, o.text];
  return L().over[o.k](colName(o.w));
}

function logText(e) {
  const v = viewer(), a = e.a;
  const hide = e.o && isPlayer(v) && e.o !== v;   // someone else's private card info
  const lg = L().log;
  switch (e.k) {
    case "got": return hide ? lg.gotHidden(colName(a[0])) : lg.got(colName(a[0]), cardName(a[1], a[2]), L().reasons[a[3]] || "");
    case "bought": return hide ? lg.boughtHidden(colName(a[0])) : lg.bought(colName(a[0]), cardName(a[1], a[2]), a[3]);
    case "discarded": return hide ? lg.discardedHidden(colName(a[0])) : lg.discarded(colName(a[0]), cardName(a[1], a[2]));
    case "useBarricade": return lg.useBarricade(colName(a[0]), cardName("barricade", a[1]), a[2], a[3] ? colName(a[3]) : "");
    case "useAbra": return lg.useAbra(colName(a[0]), cardName("abra", a[1]));
    case "useNomad": return lg.useNomad(colName(a[0]), cardName("nomad", a[1]));
    case "over": return lg.over(a[0], colName(a[1]));
  }
  return lg[e.k] ? lg[e.k](...a.map(word)) : e.k;
}

function glyphHtml(type, col, extra = "") {
  return `<span class="piece ${col} ${extra}">${GLYPH[type]}${VS}</span>`;
}
// how a board piece looks to the viewer (Abracadabra changes the viewer's own pieces)
function boardGlyph(p, extra) {
  const d = disguiseOnViewer();
  let t = realType(p);
  if (d && p[0] === viewer()) {
    if (!isKing(p)) t = d.type;
    else if (d.type === "king") extra += " gold";
  }
  return glyphHtml(t, p[0], extra);
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = tx(el.dataset.t); });
  document.getElementById("rulesList").innerHTML = L().rules.map(r => `<li>${esc(r)}</li>`).join("");
  document.getElementById("promoGrid").innerHTML = PROMO_TYPES.map(t =>
    `<button data-type="${t}"><span class="g">${GLYPH[t]}${VS}</span>${esc(typName(t))}</button>`).join("");
}

function render() {
  const v = viewer(), mover = myTurn(), dis = disguiseOnViewer();
  const flipped = mode === "online" ? myRole === "b" : rotateLocal && S.turn === "b";
  const occ = squares(S.board);
  const moveSet = new Set((S.locked && !targeting ? S.locked.moves : []).map(m => key(...m)));
  const copySet = new Set((S.pendingCopy && mover ? S.pendingCopy.squares : []).map(m => key(...m)));
  const lockMap = new Map(S.locks.map(l => [key(...l.sq), l]));
  const mineSet = new Set(S.mines.filter(m => m.by === v && m.at === S.ply && isPlayer(v)).map(m => key(...m.sq)));
  const targetCard = targeting ? S.hands[S.turn][targeting.idx] : null;
  const kingPos = S.board[S.turn + "_king"];
  const sel = S.locked ? S.board[S.locked.piece] : null;

  let html = "";
  for (let dr = 0; dr < 8; dr++) {
    for (let dc = 0; dc < 8; dc++) {
      const r = flipped ? 7 - dr : dr, c = flipped ? 7 - dc : dc, k = key(r, c);
      const p = occ[k];
      const cls = ["sq", (r + c) % 2 ? "dark" : "light"];
      if (sel && sel[0] === r && sel[1] === c) cls.push("selected");
      if (S.checked && kingPos && kingPos[0] === r && kingPos[1] === c) cls.push("check");
      const lock = lockMap.get(k);
      if (lock) cls.push("locked");
      if (targetCard && G.validTarget(S, targetCard, [r, c])) cls.push("target");
      let inner = "";
      if (p) inner += boardGlyph(p, (S.deadRolls[p] ? "dead" : "") + (lock && !isKing(p) ? " frozen" : ""));
      if (lock) inner += `<span class="lock-n">${turnsLeft(lock.until)}</span>`;
      if (mineSet.has(k)) inner += '<span class="mine-mark">✹</span>';
      if (moveSet.has(k)) inner += p ? '<span class="ring"></span>' : '<span class="dot"></span>';
      if (copySet.has(k)) inner += '<span class="dot gold"></span>';
      html += `<div class="${cls.join(" ")}" data-r="${r}" data-c="${c}">${inner}</div>`;
    }
  }
  document.getElementById("board").innerHTML = html;
  const ranks = [8,7,6,5,4,3,2,1], files = [...FILES];
  if (flipped) { ranks.reverse(); files.reverse(); }
  document.getElementById("ranks").innerHTML = ranks.map(n => `<div>${n}</div>`).join("");
  document.getElementById("files").innerHTML = files.map(f => `<div>${f}</div>`).join("");

  // turn
  document.getElementById("turnSwatch").className = "swatch " + S.turn;
  let turnText = S.over ? tx("gameOver") : tx("toMove", colName(S.turn));
  if (!S.over && mode === "online" && myRole === S.turn) turnText = tx("yourTurn", colName(S.turn));
  document.getElementById("turnText").textContent = turnText;
  renderMsg();

  // roll
  if (!rolling) {
    const rollEl = document.getElementById("roll"), sub = document.getElementById("rollSub");
    if (S.locked) { rollEl.textContent = typName(S.locked.roll); sub.textContent = `${pieceName(S.locked.piece)} · ${toSquare(S.board[S.locked.piece])}`; }
    else if (S.lastRoll && S.board[S.lastRoll.piece]) { rollEl.textContent = typName(S.lastRoll.roll); sub.textContent = `${pieceName(S.lastRoll.piece)} ✗`; }
    else { rollEl.textContent = "—"; sub.textContent = ""; }
  }

  for (const col of ["w", "b"]) {
    const C = col.toUpperCase();
    document.getElementById("king" + C).innerHTML = TYPES.map(t =>
      `<span class="chip ${S.kingOptions[col].includes(t) ? "" : "lost"}">${esc(typName(t))}</span>`).join("");
    document.getElementById("cap" + C + "Label").textContent = tx("capturedBy", colName(col));
    const caps = S.captured[col];
    document.getElementById("cap" + C).innerHTML = dis
      ? `<span class="none">${esc(tx("hiddenAbra"))}</span>`
      : caps.length ? caps.map(p => glyphHtml(realType(p), p[0])).join("") : `<span class="none">${esc(tx("nothingYet"))}</span>`;
    const list = S.rollLists[col];
    document.getElementById("odds" + C).innerHTML = TYPES.map(t => {
      const n = list.filter(x => x === t).length;
      return `<span class="chip">${esc(typName(t))}${n > 1 ? " ×" + n : ""} · ${Math.round(n / list.length * 100)}%</span>`;
    }).join("");
  }

  const logEl = document.getElementById("log");
  logEl.textContent = "";
  const lines = dis ? [tx("hiddenAbra")] : S.log.length ? S.log.map(logText) : [tx("noMoves")];
  for (const line of lines) { const d = document.createElement("div"); d.textContent = line; logEl.appendChild(d); }

  // game over popup
  const ov = document.getElementById("overlay");
  if (S.over && !overDismissed) {
    const [a, b] = overText();
    document.getElementById("overTitle").textContent = a;
    document.getElementById("overText").textContent = b;
    ov.classList.add("show");
  } else ov.classList.remove("show");

  // discard (more than 7 cards) comes before everything else for the mover
  const mustDiscard = mover && S.hands[S.turn].length > G.HAND_MAX;
  document.getElementById("discard").classList.toggle("show", mustDiscard);
  if (mustDiscard) {
    document.getElementById("discardList").innerHTML = S.hands[S.turn].map((c, i) =>
      `<div class="card-item k-${c.t}"><div class="body"><div class="name">${esc(cardName(c.t, c.l))}</div></div>
       <button data-discard="${i}">✕</button></div>`).join("");
  }
  document.getElementById("promo").classList.toggle("show", !!(S.pendingPromo && mover && !mustDiscard));

  const ng = document.getElementById("newGame");
  ng.textContent = restartArmed ? tx("clickAgain") : tx("newGame");
  ng.style.display = mode === "online" && myRole === "spectator" ? "none" : "";

  renderCards();
  renderOnline();
}

function renderCards() {
  const v = viewer(), mover = myTurn();
  const el = document.getElementById("cardsCard");
  let h = `<div class="label">${esc(tx("cardsTitle"))}</div><div class="stats">`;
  for (const col of ["w", "b"]) {
    const won = S.nomadWon[col], d = S.dist[col];
    const dist = won >= 2 ? tx("allWanderers", d) : tx("nextWanderer", d, G.NOMAD_AT[won], won === 0 ? "I" : "II");
    h += `<span class="swatch ${col}"></span><div><b>${esc(tx("points", S.points[col]))}</b> · ${esc(tx("oppHand", colName(col), S.hands[col].length))}
      <div class="muted">${esc(dist)} · ${esc(tx("pointsCap", S.earned[col]))}</div></div>`;
  }
  h += `</div><div class="small">${esc(tx("nextDraw", G.DRAW_EVERY - (S.ply % G.DRAW_EVERY)))}</div>`;

  // active effects
  const fx = S.locks.map(l => tx("lockEffect", toSquare(l.sq), turnsLeft(l.until)));
  for (const col of ["w", "b"]) {
    const d = S.disguise[col];
    if (d) fx.push(col === v ? tx("abraOnYou", turnsLeft(d.until)) : tx("abraOn", colName(col), turnsLeft(d.until)));
  }
  if (isPlayer(v)) for (const m of S.mines) if (m.by === v && m.at === S.ply) fx.push(tx("yourMine", toSquare(m.sq)));
  h += `<div class="label" style="margin-top:12px">${esc(tx("effects"))}</div><div class="effects">${fx.length ? fx.map(x => `<div>${esc(x)}</div>`).join("") : `<div class="small" style="margin:0">${esc(tx("noEffects"))}</div>`}</div>`;

  // the hand of whoever is looking (hot-seat: the player to move)
  if (isPlayer(v)) {
    const hand = S.hands[v], canUse = mover && G.canUseCard(S) && !rolling;
    h += `<div class="label" style="margin-top:12px">${esc(mode === "local" ? tx("handOf", colName(v), hand.length) : tx("yourHand", hand.length))}</div>`;
    if (S.postCard && mover) h += `<div class="row-btns" style="margin-top:0"><button class="primary" id="endPostBtn">${esc(tx("endTurn"))}</button></div>`;
    h += `<div class="hand">`;
    if (!hand.length) h += `<div class="small" style="margin:0">${esc(tx("noCards"))}</div>`;
    hand.forEach((c, i) => {
      const active = targeting && targeting.idx === i;
      h += `<div class="card-item k-${c.t} ${active ? "active" : ""}"><div class="body">
        <div class="name">${esc(cardName(c.t, c.l))}</div><div class="desc">${esc(L().cardDesc[c.t](c.l))}</div></div>
        <button data-use="${i}" ${canUse ? "" : "disabled"}>${esc(active ? tx("cancel") : tx("use"))}</button></div>`;
    });
    h += `</div>`;

    // shop
    const canShop = mover && G.canBuy(S) && !rolling;
    h += `<details class="shop" id="shopBox" ${shopOpen ? "open" : ""}><summary>${esc(tx("shop"))} · ${esc(tx("points", S.points[v]))}</summary>
      <div class="small">${esc(tx("shopHint"))} ${esc(tx("notForSale"))}</div>`;
    G.SHOP.forEach(([t, l, price], i) => {
      h += `<div class="shop-row"><span>${esc(cardName(t, l))}</span>
        <button data-buy="${i}" ${canShop && S.points[v] >= price ? "" : "disabled"}>${price}</button></div>`;
    });
    h += `</details>`;
  }
  el.innerHTML = h;
  const sb = document.getElementById("shopBox");
  if (sb) sb.ontoggle = () => { shopOpen = sb.open; };
}
let shopOpen = false;

function renderOnline() {
  const card = document.getElementById("onlineCard");
  const langBtn = `<button class="lang-btn" id="langBtn">${esc(tx("lang"))}</button>`;
  if (mode === "local") {
    card.innerHTML = `
      <div class="top-row"><div class="label" style="margin:0">${esc(tx("play"))}</div>${langBtn}</div>
      <div class="who">${esc(tx("onDevice"))}</div>
      <div class="small">${esc(tx("onDeviceHint"))}</div>
      <label class="small" style="display:flex;gap:8px;align-items:center;cursor:pointer">
        <input type="checkbox" id="rotateBox" ${rotateLocal ? "checked" : ""}> ${esc(tx("rotate"))}
      </label>
      <div class="row-btns"><button class="primary" id="createBtn">${esc(tx("createOnline"))}</button></div>`;
    document.getElementById("createBtn").onclick = createOnline;
    document.getElementById("rotateBox").onchange = e => {
      rotateLocal = e.target.checked;
      try { localStorage.setItem("rc-rotate", rotateLocal ? "1" : "0"); } catch (err) {}
      render();
    };
  } else {
    const link = gameCode ? `${location.origin}${location.pathname}#play-${gameCode}` : "";
    let led = "", status;
    if (onlineError) status = onlineError;
    else if (!connected) { led = "wait"; status = tx("connecting"); }
    else if (!myRole) { led = "wait"; status = tx("joining"); }
    else if (opponentHere) { led = "on"; status = tx("oppConnected"); }
    else { led = "wait"; status = tx("waitingOpp"); }
    const you = isPlayer(myRole) ? tx("youPlay", colName(myRole)) : myRole === "spectator" ? tx("youWatch") : tx("onlineGame");
    card.innerHTML = `
      <div class="top-row"><div class="label" style="margin:0">${esc(tx("onlineGame"))}</div>${langBtn}</div>
      <div class="who">${esc(you)}</div>
      <div class="status"><span class="led ${led}"></span><span>${esc(status)}</span></div>
      <div class="online-row">
        <input id="linkBox" readonly>
        <button id="copyBtn">${esc(tx("copyLink"))}</button>
      </div>
      <div class="small">${esc(myRole === "w" ? tx("sendLink") : tx("watchLink"))}</div>
      <div class="row-btns"><button id="leaveBtn">${esc(tx("leave"))}</button></div>`;
    const box = document.getElementById("linkBox");
    box.value = link;
    box.onclick = () => box.select();
    document.getElementById("copyBtn").onclick = e => {
      const btn = e.currentTarget;
      navigator.clipboard.writeText(link)
        .then(() => { btn.textContent = tx("copied"); setTimeout(() => btn.textContent = tx("copyLink"), 1500); })
        .catch(() => { box.select(); btn.textContent = tx("pressCtrlC"); });
    };
    document.getElementById("leaveBtn").onclick = leaveOnline;
  }
  document.getElementById("langBtn").onclick = () => {
    lang = lang === "tr" ? "en" : "tr";
    try { localStorage.setItem("rc-lang", lang); } catch (e) {}
    applyStatic();
    render();
  };
}

// ---------- setup ----------
document.getElementById("board").addEventListener("click", e => {
  const sq = e.target.closest(".sq");
  if (sq) clickSquare(+sq.dataset.r, +sq.dataset.c);
});
document.getElementById("cardsCard").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.use !== undefined) onUseCard(+b.dataset.use);
  else if (b.dataset.buy !== undefined) onBuy(+b.dataset.buy);
  else if (b.id === "endPostBtn") onEndPost();
});
document.getElementById("discardList").addEventListener("click", e => {
  const b = e.target.closest("button[data-discard]");
  if (b) onDiscard(+b.dataset.discard);
});
document.getElementById("newGame").addEventListener("click", () => {
  if (mode === "online" && !restartArmed) {
    restartArmed = setTimeout(() => { restartArmed = null; render(); }, 3000);
    return render();
  }
  clearTimeout(restartArmed); restartArmed = null;
  restart();
});
document.getElementById("overNew").addEventListener("click", () => { if (mode === "online" && myRole === "spectator") return; restart(); });
document.getElementById("overClose").addEventListener("click", () => { overDismissed = true; render(); });
document.getElementById("promoGrid").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) onPromotion(b.dataset.type);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && targeting) { targeting = null; render(); } });
window.addEventListener("hashchange", readHash);

applyStatic();
S = G.freshState();
render();
readHash();
</script>
</body>
</html>
